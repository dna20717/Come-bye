function mkCritter(x,y,hw,h,kind){ return {x,y,vx:0,vy:0,gr:false,hw,h,face:rnd()<.5?1:-1,t:(rnd()*100)|0,kind,peck:0,scare:0,anim:0}; }

/* --- collision --- */
function fMoveX(e,dx){
  e.x+=dx; if(!dx) return;
  const edge=dx>0?e.x+e.hw:e.x-e.hw, ys=[e.y-e.h+0.6,e.y-0.6];
  for(const yy of ys) if(fsolid(edge,yy)){ const tx=Math.floor(edge/TS); e.x=dx>0?tx*TS-e.hw-0.001:(tx+1)*TS+e.hw+0.001; e.vx=0; return; }
}
function fMoveY(e,dy){
  const old=e.y; e.y+=dy; e.gr=false;
  const xs=[e.x-e.hw+0.6,e.x+e.hw-0.6];
  if(dy>0){ for(const xx of xs){ const tx=Math.floor(xx/TS), ty=Math.floor(e.y/TS), c=ft(tx,ty), top=ty*TS;
      if(FSOL.has(c)||(FONE.has(c)&&old<=top+0.01&&!(e.drop>0))){ e.y=top; e.vy=0; e.gr=true; return; } } }
  else if(dy<0){ for(const xx of xs) if(fsolid(xx,e.y-e.h)){ const ty=Math.floor((e.y-e.h)/TS); e.y=(ty+1)*TS+e.h; e.vy=0; return; } }
}
const onOneWay=e=>{ const a=ftp(e.x-e.hw+0.6,e.y+0.5), b=ftp(e.x+e.hw-0.6,e.y+0.5); return !FSOL.has(a)&&!FSOL.has(b)&&(FONE.has(a)||FONE.has(b)); };
function wallSide(e){ const my=e.y-e.h*0.5; if(fsolid(e.x+e.hw+0.8,my)) return 1; if(fsolid(e.x-e.hw-0.8,my)) return -1; return 0; }
function tryGrab(e,gd){
  const txF=Math.floor((e.x+gd*(e.hw+1.5))/TS), txS=Math.floor(e.x/TS), top=e.y-e.h;
  for(let ty=Math.floor((top-5)/TS); ty<=Math.floor((top+3)/TS); ty++){
    const c=ft(txF,ty), lt=ty*TS; if(lt<top-5||lt>top+3) continue;
    if(!(FSOL.has(c)||FONE.has(c))) continue;
    if(FSOL.has(ft(txF,ty-1))||FSOL.has(ft(txS,ty-1))||FONE.has(ft(txF,ty-1))) continue;
    e.st='hang'; e.ledge=lt; e.ltx=txF; e.hangT=0; e.vx=0; e.vy=0; e.face=gd;
    e.x=FSOL.has(c)?(gd>0?txF*TS-e.hw-0.01:(txF+1)*TS+e.hw+0.01):(gd>0?txF*TS-e.hw+2:(txF+1)*TS+e.hw-2);
    e.y=lt+e.h-1; return true;
  }
  return false;
}
function fSurface(e){ let ty=Math.floor((e.y-0.5)/TS); while(ty>0&&ft(Math.floor(e.x/TS),ty-1)==='~') ty--; return ty*TS; }

/* --- the dog (and Moxy): run, jump, hang, pull up, wall-slide, wall-jump, swim --- */
function mkF(src,x,y){ const f=src.spr.run[0];
  return {x,y,vx:0,vy:0,gr:false,hw:4,h:Math.max(5,f.h),src,P:src.fm,face:1,st:'move',jbuf:0,coy:0,wcoy:0,lastWall:0,wallDir:0,lock:0,noGrab:0,drop:0,holdT:99,
    slide:false,swim:false,pendShake:false,shake:0,sq:0,anim:0,crouch:false,pt:0,cd:0,stuck:0,lx:x}; }
function stepF(e,c,isDog){
  const P=e.P;
  if(c.jump) e.jbuf=8;
  for(const k of ['lock','noGrab','drop','wcoy','cd']) if(e[k]>0) e[k]--;
  if(e.shake>0){ e.shake--; e.vx*=0.5; if(e.shake%3===0) fspray(e.x+(rnd()-.5)*8,e.y-e.h+1,2,['#d8f1f6','#9fd3e2']); fMoveX(e,e.vx); e.vy+=FG; fMoveY(e,e.vy); return; }
  if(e.st==='hang'){
    e.hangT++;
    if(e.jbuf>0||c.up||(c.dir===e.face&&e.hangT>8)){ e.st='pull'; e.pt=0; e.jbuf=0; e.p0x=e.x; e.p0y=e.y;
      e.p1x=e.face>0?e.ltx*TS+e.hw+0.5:(e.ltx+1)*TS-e.hw-0.5; e.p1y=e.ledge; }
    else if(c.down||c.dir===-e.face){ e.st='move'; e.noGrab=14; e.vy=0.3; }
    return;
  }
  if(e.st==='pull'){
    e.pt=Math.min(1,e.pt+1/12); const t=sstep(0,1,e.pt);
    e.y=e.p0y+(e.p1y-e.p0y)*Math.min(1,t*1.6); e.x=e.p0x+(e.p1x-e.p0x)*Math.max(0,(t-0.3)/0.7);
    if(e.pt>=1){ e.st='move'; e.gr=true; e.vx=0; e.vy=0; }
    return;
  }
  const inW=ftp(e.x,e.y-1)==='~';
  if(inW&&!e.swim){ e.swim=true; e.vy*=0.3; if(isDog||rnd()<.5) splash(); fspray(e.x,e.y-2,8,['#d8f1f6','#9fd3e2']); }
  if(!inW&&e.swim){ e.swim=false; e.pendShake=true; }
  if(e.swim){
    e.vx+=(c.dir*0.55-e.vx)*0.08; if(c.dir) e.face=c.dir;
    const surf=fSurface(e), target=surf+e.h*0.7+(c.down?10:0);
    e.vy+=(target-e.y)*0.02; if(c.up) e.vy-=0.03; e.vy*=0.86;
    if(e.jbuf>0&&e.y<surf+e.h+2){ e.vy=-P.jump*1.05; e.jbuf=0; e.holdT=0; whoosh(); }
    fMoveX(e,e.vx); fMoveY(e,e.vy); e.anim+=0.12; e.slide=false; e.crouch=false; return;
  }
  const below=ftp(e.x,e.y+0.5), onIce=e.gr&&below==='I';
  e.crouch=false;
  if(c.down&&e.gr){ if(onOneWay(e)){ e.drop=12; e.gr=false; e.y+=1; } else e.crouch=true; }
  const target=e.crouch?0:c.dir*P.spd;
  if(e.gr) e.vx+=(target-e.vx)*(c.dir&&!e.crouch?(onIce?0.03:P.acc):(onIce?0.015:P.fric));
  else e.vx+=(target-e.vx)*(e.lock>0?0.012:c.dir?0.07:0.02);
  if(c.dir&&(e.gr||e.lock===0)) e.face=c.dir;
  if(e.jbuf>0){
    if(e.gr||e.coy>0){ e.vy=-P.jump; e.gr=false; e.coy=0; e.holdT=0; e.jbuf=0; e.sq=-0.15; fdust(e.x,e.y,2); if(isDog) whoosh(); }
    else if(e.wallDir||e.wcoy>0){ const wd=e.wallDir||e.lastWall; e.vx=-wd*P.wj; e.vy=-P.jump*0.95; e.lock=10; e.holdT=0; e.face=-wd; e.wcoy=0; e.jbuf=0;
      fdust(e.x+wd*e.hw,e.y-e.h*0.5,3); if(isDog){ wallJumps++; whoosh(); } }
  }
  let gg=FG; if(!c.held) e.holdT=99;
  if(e.vy<0&&c.held&&e.holdT<P.hold){ gg*=0.45; e.holdT++; } else if(Math.abs(e.vy)<0.22) gg*=0.6; else if(e.vy>0) gg*=1.15;
  e.vy=Math.min(2.6,e.vy+gg);
  e.slide=false;
  if(!e.gr&&e.wallDir&&c.dir===e.wallDir&&e.vy>0){ e.vy=Math.min(e.vy,P.slide); e.slide=true; e.face=e.wallDir; if(frames%6===0) fdust(e.x+e.wallDir*e.hw,e.y-2,1); }
  const wasGr=e.gr, vy0=e.vy;
  fMoveX(e,e.vx); fMoveY(e,e.vy);
  e.wallDir=e.gr?0:wallSide(e);
  if(e.wallDir){ e.wcoy=6; e.lastWall=e.wallDir; }
  if(wasGr&&!e.gr&&e.vy>=0) e.coy=6; else if(e.gr) e.coy=0; else if(e.coy>0) e.coy--;
  if(!wasGr&&e.gr){ e.sq=Math.min(0.25,vy0*0.12); if(vy0>0.9) fdust(e.x,e.y,vy0>1.6?4:2); if(isDog&&vy0>1.9) thud();
    if(e.pendShake){ e.pendShake=false; e.shake=24; brrr(isDog?1:1.5); } }
  if(!e.gr&&e.noGrab===0&&e.vy>-0.5&&c.dir) tryGrab(e,c.dir);
  e.anim+=Math.abs(e.vx)*0.35; e.sq*=0.8;
}
function pupCtl(p){
  const d=fdog, dx=d.x-d.face*10-p.x, dy=d.y-p.y, dist=Math.hypot(d.x-p.x,d.y-p.y);
  const c={dir:Math.abs(dx)>6?Math.sign(dx):0,up:false,down:false,jump:false,held:true};
  if(p.st==='hang') c.up=true;
  if(p.swim) c.up=dy<0;
  if(p.cd===0&&(p.gr||p.swim)&&((c.dir&&p.wallDir===c.dir)||(dy<-10&&Math.abs(dx)<26)||(p.swim&&dy<-4))){ c.jump=true; p.cd=24; }
  if(!p.gr&&p.wallDir&&dy<-8&&p.cd===0){ c.jump=true; p.cd=10; }
  if(p.gr&&dy>12&&Math.abs(dx)<10&&onOneWay(p)) c.down=true;
  if(dist>30&&Math.abs(p.x-p.lx)<0.15) p.stuck++; else p.stuck=0; p.lx=p.x;
  if(dist>120||p.stuck>200){ const off=Math.abs(p.x-fcamX-FW/2)>FW/2+10||Math.abs(p.y-fcamY-FH/2)>FH/2+10;
    if(off||p.stuck>200){ Object.assign(p,{x:d.x-d.face*8,y:d.y,vx:0,vy:0,st:'move',swim:false,stuck:0}); fdust(p.x,p.y,5); yip(); } }
  return c;
}
function stepCritter(e){
  const d=fdog, dist=Math.abs(e.x-d.x)+Math.abs(e.y-d.y)*2;
  if(e.scare>0) e.scare--;
  const near=e.kind==='chick'?22:28;
  if(dist<near&&!(d.crouch)) e.scare=Math.max(e.scare,40);
  if(e.scare>0){ e.vx+=(Math.sign(e.x-d.x||1)*(e.kind==='chick'?0.9:0.8)-e.vx)*0.2; if(e.kind==='chick'&&e.gr&&rnd()<.06) e.vy=-1.1; e.peck=0; }
  else { if(--e.t<=0){ e.t=60+((rnd()*140)|0); const r=rnd(); if(r<.4){ e.vx=0; e.peck=e.kind==='chick'?50:70; } else { e.face=rnd()<.5?1:-1; e.vx=e.face*(e.kind==='chick'?0.3:0.2); } }
    e.vx*=0.98; if(e.peck>0) e.peck--; }
  const ahead=ftp(e.x+Math.sign(e.vx)*(e.hw+3),e.y+2);
  if(e.gr&&(ahead==='~'||ahead==='I'||ahead==='.')&&e.scare===0){ e.vx=-e.vx; }
  if(e.kind==='sheep'&&(e.x<96*8&&e.vx<0)) e.vx=Math.abs(e.vx);
  if(Math.abs(e.vx)>0.03) e.face=Math.sign(e.vx);
  const ovx=e.vx; fMoveX(e,e.vx); if(e.vx===0&&ovx!==0){ if(e.gr&&e.scare>0) e.vy=-1.2; else e.vx=-ovx; }
  e.vy=Math.min(2.5,e.vy+FG); fMoveY(e,e.vy);
  e.anim+=Math.abs(e.vx)*0.4;
}
function fdust(x,y,n){ for(let i=0;i<n;i++) ffx.push({x:x+(rnd()-.5)*4,y:y-0.5,vx:(rnd()-.5)*0.5,vy:-rnd()*0.35,g:0.02,life:14+rnd()*8,c:SEASON.ice?'#ffffff':pick(['#d8c9a6','#c9b88f'])}); }
function fspray(x,y,n,cols){ for(let i=0;i<n;i++) ffx.push({x,y,vx:(rnd()-.5)*1.1,vy:-rnd()*0.9,g:0.05,life:20+rnd()*10,c:pick(cols)}); }

/* --- run state --- */
function resetFarm(){
  if(!FT) return;
  const [sx,sy]=FARM.start;
  fdog=mkF(DOGS[chosen],sx*TS+4,sy*TS); fdog.D=DOGS[chosen]; dog=fdog;
  fpup=pupOn?mkF(MOXY,fdog.x-10,fdog.y):null;
  fcamX=clamp(fdog.x-FW/2,0,FARM.W*TS-FW); fcamY=clamp(fdog.y-FH*0.6,0,FARM.H*TS-FH);
  ffx=[]; famb=[]; fPlayFrames=0; wallJumps=0; hudFarm();
}
function farmSwapDog(){ if(!fdog) return; const o=fdog; fdog=mkF(DOGS[chosen],o.x,o.y); fdog.D=DOGS[chosen]; fdog.face=o.face; dog=fdog; }
function hudFarm(){ document.getElementById('count').textContent='Leckerli '+treats.filter(t=>t.got).length+'/'+treats.length; }
function farmBark(){
  if(MODE!=='farm'||state!=='play') return; audio();
  const now=performance.now(); if(now-lastWuff<700) return; lastWuff=now;
  bark(); bubble('Wuff!',fdog.D.name);
  let sheepNear=false;
  chickens.forEach(c=>{ if(Math.abs(c.x-fdog.x)<60&&Math.abs(c.y-fdog.y)<40) c.scare=70; });
  fsheep.forEach(s=>{ if(Math.abs(s.x-fdog.x)<70&&Math.abs(s.y-fdog.y)<40){ s.scare=60; sheepNear=true; } });
  if(sheepNear) setTimeout(()=>bleat({x:LW/2,stubborn:false}),250);
}
function finishFarm(){
  state='win';
  document.getElementById('winTitle').textContent='Alle gefunden!';
  document.getElementById('winText').textContent=fdog.D.name+' hat alle '+treats.length+' Leckerlis auf dem Hof aufgespürt.';
  document.getElementById('rL1').textContent='Zeit'; document.getElementById('rV1').textContent=fmt(fPlayFrames);
  document.getElementById('rL2').textContent='Walljumps'; document.getElementById('rV2').textContent=String(wallJumps);
  document.getElementById('r3').hidden=true;
  document.getElementById('again').textContent='Weiter stromern';
  document.getElementById('stars').innerHTML='★★★';
  setTimeout(()=>say('super'),300); setTimeout(bark,1300); if(pupOn) setTimeout(yip,1700);
  const cols=['#f2c14e','#e98fa3','#ffffff','#c9b3e8','#f5e6a8'];
  for(let i=0;i<90;i++) ffx.push({x:fcamX+rnd()*FW,y:fcamY-rnd()*40,vx:(rnd()-.5)*.4,vy:rnd()*.5,c:cols[i%5],life:300+rnd()*120,g:.01});
  setTimeout(()=>{ winCard.hidden=false; },1300);
}
function stepFarm(){
  frames++;
  const d=fdog; if(!d) return;
  const play=state==='play';
  const dir=play?(DP.x||((KS.r?1:0)-(KS.l?1:0))):0;
  const c={dir,up:play&&(DP.up||KS.u),down:play&&(DP.down||KS.d),jump:play&&fJumpTap,held:fJumpHeld};
  fJumpTap=false;
  if(play) fPlayFrames++;
  stepF(d,c,true);
  if(pupOn&&fpup) stepF(fpup,pupCtl(fpup),false);
  chickens.forEach(stepCritter); fsheep.forEach(stepCritter);
  if(play) for(const t of treats){ if(t.got) continue;
    if(Math.abs(d.x-t.x)<7&&Math.abs(d.y-d.h*0.5-t.y)<8){ t.got=true; chime(); fspray(t.x,t.y,10,['#f2c14e','#ffffff','#fff3c4']);
      const n=treats.filter(q=>q.got).length; hudFarm(); bubble('Mjam!','Leckerli '+n+'/'+treats.length); if(n===treats.length) finishFarm(); } }
  flook+=(d.face*18-flook)*0.03;
  const tx=d.x-FW/2+flook, ty=d.y-FH*0.6;
  fcamX+=(tx-fcamX)*0.1; fcamY+=(ty-fcamY)*0.1;
  fcamX=clamp(fcamX,0,FARM.W*TS-FW); fcamY=clamp(fcamY,0,FARM.H*TS-FH);
  ffx.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; }); ffx=ffx.filter(p=>p.life>0);
  farmAmbient();
}
function farmAmbient(){
  const k=SEASON.ambient, sky=(x,y)=>freg(Math.floor(x/TS),Math.floor(y/TS))==='sky'&&!fsolid(x,y)&&ftp(x,y)!=='~';
  if(fcamY<FARM.G*TS){
    if(k==='snow'&&rnd()<.5) famb.push({x:fcamX+rnd()*(FW+30),y:fcamY-2,vx:-0.1,vy:.2+rnd()*.25,ph:rnd()*6,c:'#ffffff',k});
    if(k==='leaf'&&rnd()<.06) famb.push({x:fcamX+rnd()*(FW+60),y:fcamY-2,vx:-0.25-rnd()*.25,vy:.25+rnd()*.2,ph:rnd()*6,c:pick(['#d9822e','#a8501f','#efb24c']),k});
    if(k==='petal'&&rnd()<.05) famb.push({x:fcamX+rnd()*(FW+60),y:fcamY-2,vx:-0.2-rnd()*.2,vy:.2+rnd()*.15,ph:rnd()*6,c:pick(['#f6bfd0','#ffffff']),k});
    if(k==='butterfly'&&famb.length<4) famb.push({x:fcamX+rnd()*FW,y:FARM.G*TS-12-rnd()*40,vx:0,vy:0,ph:rnd()*6,c:pick(['#fff3a8','#ffffff','#f6bfd0']),k:'fly'});
  }
  famb.forEach(p=>{ if(p.k==='fly'){ p.vx+=(rnd()-.5)*.06; p.vy+=(rnd()-.5)*.06; p.vx*=.96; p.vy*=.96; p.x+=p.vx; p.y+=p.vy; if(!sky(p.x,p.y)){ p.vx*=-1; p.vy=-Math.abs(p.vy)-0.1; } }
    else { p.x+=p.vx+Math.sin(p.ph+frames*.05)*.2; p.y+=p.vy; } });
  famb=famb.filter(p=>p.k==='fly'?Math.abs(p.x-fcamX-FW/2)<FW:(sky(p.x,p.y)&&p.y<fcamY+FH+4));
}

/* --- drawing --- */
function FR(x,y,w,h,c){ const X0=Math.round((x-fcamX)*FS), X1=Math.round((x+w-fcamX)*FS), Y0=Math.round((y-fcamY)*FS), Y1=Math.round((y+h-fcamY)*FS);
  fctx.fillStyle=c; fctx.fillRect(X0,Y0,Math.max(1,X1-X0),Math.max(1,Y1-Y0)); }
function FSR(x,y,w,h,c){ fctx.fillStyle=c; fctx.fillRect(Math.round(x*FS),Math.round(y*FS),Math.max(1,Math.round((x+w)*FS)-Math.round(x*FS)),Math.max(1,Math.round((y+h)*FS)-Math.round(y*FS))); }
const CHICK=[sprite(["...r..","..wwk.","w.wwwy","wwwww.",".www..","..y..."],{w:'#f7f3e6',r:'#d94b4b',k:'#2a1d17',y:'#e0a030'}),
  sprite(["......","...r..","w.wwk.","wwwwwy",".www..","..y..."],{w:'#f7f3e6',r:'#d94b4b',k:'#2a1d17',y:'#e0a030'})];
function drawSpriteW(fr,face,x,y,rot,sq){
  const img=face>0?fr.r:fr.l;
  fctx.save(); fctx.translate(Math.round((x-fcamX)*FS),Math.round((y-fcamY)*FS)); if(rot) fctx.rotate(rot*face); if(sq) fctx.scale(1+sq*0.5,1-sq);
  fctx.drawImage(img,Math.round(-fr.w/2)*FS,-fr.h*FS,fr.w*FS,fr.h*FS); fctx.restore();
}
function drawFDog(e){
  const S=e.src.spr; let fr, rot=0;
  if(e.st==='hang'){ fr=S.run[0]; rot=-1.05; }
  else if(e.st==='pull'){ fr=S.run[1]; rot=-1.05*(1-e.pt); }
  else if(e.slide){ fr=S.run[(frames>>3)%2]; rot=-1.3; }
  else if(e.swim){ fr=S.run[(e.anim|0)%2]; }
  else if(!e.gr){ fr=S.run[1]; rot=clamp(e.vy*0.22,-0.35,0.4); }
  else if(e.crouch){ fr=S.down; }
  else if(Math.abs(e.vx)>0.06){ fr=S.run[(e.anim|0)%2]; }
  else fr=S.wag[(frames>>3)%2];
  const j=e.shake>0?((e.shake>>1)%2?1:-1):0;
  tickIdle(e,e.gr&&!e.swim&&e.st==='move'&&Math.abs(e.vx)<0.03&&!e.crouch&&!(e.shake>0));
  const ip=idlePose(e,S);
  if(e.gr&&!e.swim) FR(e.x-fr.w/2+2,e.y,fr.w-4,1,'rgba(30,30,20,.22)');
  if(ip){ drawPoseScaled(fctx,FS,ip.fr,e.face,Math.round((e.x-fcamX)*FS),Math.round((e.y-fcamY-(ip.dy||0))*FS),ip.rot); return; }
  drawSpriteW(fr,e.face,e.x+j,e.y,rot,e.sq);
}
const BONE=["ww...ww",".wwwww.","ww...ww"];
function drawTreat(t){
  const bob=Math.round(Math.sin(frames*0.08+t.i)*1.2), x0=Math.round(t.x-3.5), y0=Math.round(t.y-1.5)+bob;
  for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1]]) BONE.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='w') FR(x0+x+ox,y0+y+oy,1,1,'#3a2a1f'); }));
  BONE.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='w') FR(x0+x,y0+y,1,1,'#fff3dc'); }));
  if((frames+t.i*17)%50<6) FR(x0+5,y0-2,1,1,'#ffffff');
}
function renderFarm(){
  if(!FT||!fdog) return;
  const g=fctx; g.imageSmoothingEnabled=false;
  const [a,b]=FPAL.sky; for(let i=0;i<8;i++) FSR(0,i*FH/8,FW,FH/8+1,mixHex(a,b,i/7));
  const gy=FARM.G*TS-fcamY, ref=FARM.G*TS-FH*0.6;
  const lay=(L,f,base)=>{ const tw=L.width; let off=-((fcamX*f)%tw); if(off>0) off-=tw; for(let x=off;x<FW;x+=tw) g.drawImage(L,Math.round(x*FS),Math.round((base-70)*FS),tw*FS,70*FS); };
  for(let i=0;i<5;i++){ const cx=((i*97-fcamX*0.06)%440+440)%440-40, cy=10+i*7-(fcamY-ref)*0.1; FSR(cx,cy,14,2,'#ffffff'); FSR(cx+3,cy-1,8,1,'#ffffff'); }
  const farB=gy+(fcamY-ref)*0.6+6, midB=gy+(fcamY-ref)*0.35+3;
  lay(fFar,0.15,farB); FSR(0,farB,FW,Math.max(0,FH-farB),FPAL.hill);
  lay(fMid,0.35,midB); FSR(0,midB,FW,Math.max(0,FH-midB),FPAL.hill2);
  g.drawImage(mapCv,fcamX,fcamY,FW,FH,0,0,FW*FS,FH*FS);
  treats.forEach(t=>{ if(!t.got&&Math.abs(t.x-fcamX-FW/2)<FW/2+8&&Math.abs(t.y-fcamY-FH/2)<FH/2+8) drawTreat(t); });
  chickens.forEach(c=>drawSpriteW(CHICK[c.peck>0&&(frames>>3)%2?1:0],c.face,c.x,c.y,0,0));
  fsheep.forEach(s=>drawSpriteW(sheepSpr[Math.abs(s.vx)>0.05?((s.anim|0)%2):(s.peck>0?2:0)],s.face,s.x,s.y,0,0));
  if(pupOn&&fpup) drawFDog(fpup);
  drawFDog(fdog);
  g.globalAlpha=0.55; g.drawImage(waterCv,fcamX,fcamY,FW,FH,0,0,FW*FS,FH*FS); g.globalAlpha=1;
  ffx.forEach(p=>FR(p.x,p.y,1,1,p.c));
  famb.forEach(p=>{ if(p.k==='leaf') FR(p.x,p.y,2,1,p.c);
    else if(p.k==='fly'){ if((frames+(p.ph*10|0))%12<6) FR(p.x-1,p.y,3,1,p.c); else FR(p.x,p.y,1,1,p.c); FR(p.x,p.y+1,1,1,'#3b302a'); }
    else FR(p.x,p.y,1,1,p.c); });
  if(NIGHT) nightFarm();
}

/* --- input: d-pad (slide your thumb), jump, bark, keyboard --- */
const dpad=document.getElementById('dpad');
function dpadSet(ev){ const r=dpad.getBoundingClientRect(), dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2), th=r.width*0.15;
  DP.x=dx<-th?-1:dx>th?1:0; DP.up=dy<-th*1.1; DP.down=dy>th*1.1; dpadVis(); }
function dpadVis(){ dpad.querySelector('.u').classList.toggle('on',DP.up); dpad.querySelector('.d').classList.toggle('on',DP.down);
  dpad.querySelector('.l').classList.toggle('on',DP.x<0); dpad.querySelector('.r').classList.toggle('on',DP.x>0); }
let dpadId=null;
dpad.addEventListener('pointerdown',ev=>{ ev.preventDefault(); audio(); dpadId=ev.pointerId; try{dpad.setPointerCapture(ev.pointerId);}catch(_){} dpadSet(ev); });
dpad.addEventListener('pointermove',ev=>{ if(ev.pointerId===dpadId) dpadSet(ev); });
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,ev=>{ if(ev.pointerId!==dpadId) return; dpadId=null; DP.x=0; DP.up=false; DP.down=false; dpadVis(); }));
holdBtn(document.getElementById('f-jump'),()=>{ if(MODE!=='farm') return; audio(); fJumpHeld=true; fJumpTap=true; },()=>{ fJumpHeld=false; });
document.getElementById('f-bark').addEventListener('click',farmBark);
const FKEYS={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{
  if(MODE!=='farm'||state!=='play') return;
  if(FKEYS[e.key]){ KS[FKEYS[e.key]]=true; e.preventDefault(); }
  else if((e.key===' '||e.key==='k'||e.key==='z')&&!e.repeat){ e.preventDefault(); fJumpHeld=true; fJumpTap=true; }
  else if((e.key==='x'||e.key==='b'||e.key==='j')&&!e.repeat){ e.preventDefault(); farmBark(); }
});
addEventListener('keyup',e=>{ if(FKEYS[e.key]) KS[FKEYS[e.key]]=false; if(e.key===' '||e.key==='k'||e.key==='z') fJumpHeld=false; });

/* ---------- Idle: sit, lie down, roll onto the back and wiggle ---------- */
const IDLE0=240;
function tickIdle(e,still){ e.idleT=still?(e.idleT||0)+1:0; }
function idlePose(e,S){
  const t=(e.idleT||0)-IDLE0; if(t<0) return null;
  const c=t%480;
  if(c<70) return {fr:S.wag[(frames>>3)%2],rot:0};
  if(c<130) return {fr:S.down,rot:0};
  if(c<150) return {fr:S.down,rot:Math.PI*(c-130)/20};                 // roll over
  if(c<290) return {fr:S.run[(c>>3)&1],rot:Math.PI,dy:(c>>4)&1};        // belly up, legs paddling
  if(c<310) return {fr:S.down,rot:Math.PI*(1+(c-290)/20)};              // roll back
  return {fr:S.down,rot:0};
}
function drawPoseArt(g,fr,face,x,y,rot){
  const img=face>0?fr.r:fr.l, hh=Math.round(fr.h/2);
  if(!rot){ g.drawImage(img,x-(fr.w>>1),y-fr.h); return; }
  g.save(); g.translate(x,y-hh); g.rotate(rot*face); g.drawImage(img,-(fr.w>>1),-hh); g.restore();
}
function drawPoseScaled(g,S,fr,face,sx,sy,rot){
  const img=face>0?fr.r:fr.l, hh=Math.round(fr.h/2);
  g.save(); g.translate(sx,sy-hh*S); if(rot) g.rotate(rot*face); g.drawImage(img,-(fr.w>>1)*S,-hh*S,fr.w*S,fr.h*S); g.restore();
}

/* ---------- Night: one small light mask, multiplied over the finished frame ---------- */
let NIGHT=false; try{ NIGHT=localStorage.getItem('comebye-night')==='1'; }catch(e){}
const WARM='255,205,140', COOL='225,232,255', CYAN='140,220,255', LAMPS=[[8,30],[13,29],[40,24],[52,24],[72,24]];
let fCrystals=[];
const LMc=document.createElement('canvas'), LMx=LMc.getContext('2d');
const STc=document.createElement('canvas'), STx=STc.getContext('2d');
const LT=(x,y,r,rgb,a)=>({x,y,r,c:'rgba('+rgb+','+a+')',m:'rgba('+rgb+','+(a*0.42).toFixed(3)+')'});
function nightPass(g,W,H,S,tint,lights){
  if(LMc.width!==W||LMc.height!==H){ LMc.width=W; LMc.height=H; }
  LMx.globalCompositeOperation='source-over'; LMx.fillStyle=tint; LMx.fillRect(0,0,W,H);
  LMx.globalCompositeOperation='lighter';
  for(const L of lights){
    if(L.x<-L.r||L.y<-L.r||L.x>W+L.r||L.y>H+L.r) continue;
    const gr=LMx.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);
    gr.addColorStop(0,L.c); gr.addColorStop(0.45,L.m); gr.addColorStop(1,'rgba(0,0,0,0)');
    LMx.fillStyle=gr; LMx.fillRect(L.x-L.r,L.y-L.r,L.r*2,L.r*2);
  }
  g.save(); g.globalCompositeOperation='multiply'; g.imageSmoothingEnabled=true; g.drawImage(LMc,0,0,W*S,H*S); g.restore();
  g.imageSmoothingEnabled=false;
}
const STARS=Array.from({length:80},(_,i)=>({x:(i*97.31)%460,f:(i*0.618034)%1,ph:i*1.7,b:i%7===0}));
function drawSkyNight(g,S,W,limY,offX,moonY){
  const px=(x,y,c)=>{ g.fillStyle=c; g.fillRect(Math.round(x*S),Math.round(y*S),S,S); };
  for(const s of STARS){ const x=((s.x-offX)%460+460)%460; if(x>W) continue; const y=2+s.f*(limY-4); if(y>limY) continue;
    const tw=Math.sin(frames*0.04+s.ph); px(x,y,tw>0.2?'#ffffff':'#9fb0d8'); if(s.b&&tw>0.6){ px(x-1,y,'#7f90c0'); px(x+1,y,'#7f90c0'); } }
  const mx=W-28;
  if(moonY<limY-6) for(let dy=-5;dy<=5;dy++) for(let dx=-5;dx<=5;dx++){ if(dx*dx+dy*dy>27) continue;
    px(mx+dx,moonY+dy,(dx===-2&&dy===-1)||(dx===1&&dy===2)||(dx===2&&dy===-2)?'#d8d2b8':'#f4f1de'); }
}
function fireflies(g,S,pos){
  if(SEASON.ice) return;
  for(let i=0;i<14;i++){ if(Math.sin(frames*0.045+i*2.3)<0.5) continue; const p=pos(i); if(!p) continue;
    g.fillStyle='rgba(234,255,138,0.28)'; g.fillRect(Math.round((p[0]-1)*S),Math.round((p[1]-1)*S),3*S,3*S);
    g.fillStyle='#f4ffb0'; g.fillRect(Math.round(p[0]*S),Math.round(p[1]*S),S,S); }
}
const ffX=(i,W,off)=>((i*37.3-off+Math.sin(frames*0.007+i*2)*25)%W+W)%W;
function owl(){ if(!audio()) return;
  [0,0.45].forEach((dt,i)=>{ const t=AC.currentTime+0.05+dt, o=AC.createOscillator(), g=AC.createGain(), v=AC.createOscillator(), vg=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(i?360:410,t); o.frequency.linearRampToValueAtTime(i?330:380,t+0.32);
    v.frequency.value=7; vg.gain.value=6; v.connect(vg).connect(o.frequency);
    env(g,t,0.06,0.1,0.18,0.12); o.connect(g).connect(master); o.start(t); v.start(t); o.stop(t+0.5); v.stop(t+0.5); }); }
function nightHerd(isAgi){
  const L=[LT(dog.x,dog.y-3,isAgi?40:46,WARM,0.9)], fl=1+Math.sin(frames*0.13)*0.04;
  if(pupOn&&pup) L.push(LT(pup.x,pup.y-2,18,WARM,0.45));
  if(isAgi) [[-10,-10],[LW+10,-10],[-10,LH+10],[LW+10,LH+10]].forEach(([x,y])=>L.push(LT(x,y,115,COOL,0.75)));
  else { L.push(LT(GATE.x-1,50,34*fl,WARM,0.85),LT(GATE.x+18,50,34*fl,WARM,0.85)); ctx.fillStyle='#fff3c4'; ctx.fillRect(GATE.x-1,49,1,1); ctx.fillRect(GATE.x+18,49,1,1); }
  nightPass(ctx,LW,LH,1,'#4a5893',L);
  fireflies(ctx,1,i=>[ffX(i,LW,0),LH*0.12+((i*0.37)%1)*LH*0.8+Math.sin(frames*0.011+i)*6]);
}
function sideLamps(){ const k0=Math.floor((camX-60)/110), k1=Math.ceil((camX+VW+60)/110);
  for(let k=k0;k<=k1;k++){ const wx=k*110+40; WR(wx,-32,1,32,'#3d3a40'); WR(wx-1,-33,3,1,'#fff3c4'); } }
function nightSide(){
  const L=[], k0=Math.floor((camX-60)/110), k1=Math.ceil((camX+VW+60)/110);
  for(let k=k0;k<=k1;k++) L.push(LT(k*110+40-camX,GY-31,80,WARM,0.8));
  L.push(LT(sdog.x-camX,GY+sdog.y-3,34,WARM,0.7)); if(pupOn&&spup) L.push(LT(spup.x-camX,GY+spup.y-2,16,WARM,0.4));
  nightPass(sctx,VW,VH,SS,'#38427c',L);
  drawSkyNight(sctx,SS,VW,GY-44,camX*0.05,12);
  fireflies(sctx,SS,i=>[((i*53.1-camX*0.9+Math.sin(frames*0.007+i*2)*20)%VW+VW)%VW,GY-4-((i*0.41)%1)*30+Math.sin(frames*0.011+i)*3]);
}
function nightFarm(){
  const ox=fcamX, oy=fcamY, L=[], fl=1+Math.sin(frames*0.13)*0.05;
  LAMPS.forEach(([tx,ty])=>L.push(LT(tx*8+3.5-ox,ty*8+4-oy,44*fl,WARM,0.95)));
  [[7,21],[11,25]].forEach(([tx,ty])=>L.push(LT(tx*8-ox,ty*8-oy,30,WARM,0.7)));
  fCrystals.forEach(([x,y])=>L.push(LT(x-ox,y-oy,12,CYAN,0.55)));
  treats.forEach(t=>{ if(!t.got) L.push(LT(t.x-ox,t.y-oy,10,WARM,0.45)); });
  L.push(LT(fdog.x-ox,fdog.y-4-oy,36,WARM,0.75)); if(pupOn&&fpup) L.push(LT(fpup.x-ox,fpup.y-3-oy,16,WARM,0.4));
  nightPass(fctx,FW,FH,FS,'#2c3462',L);
  const gy=FARM.G*TS-fcamY, ref=FARM.G*TS-FH*0.6, farB=gy+(fcamY-ref)*0.6+6, lim=farB-50;
  if(lim>4){
    if(STc.width!==FW||STc.height!==FH){ STc.width=FW; STc.height=FH; }
    STx.globalCompositeOperation='source-over'; STx.clearRect(0,0,FW,FH);
    drawSkyNight(STx,1,FW,lim,fcamX*0.05,14-(fcamY-ref)*0.1);
    STx.globalCompositeOperation='destination-out'; STx.drawImage(mapCv,fcamX,fcamY,FW,FH,0,0,FW,FH);
    fctx.drawImage(STc,0,0,FW*FS,FH*FS);
  }
  fireflies(fctx,FS,i=>{ const x=((i*53.1-fcamX*0.9+Math.sin(frames*0.007+i*2)*20)%FW+FW)%FW, y=gy-4-((i*0.41)%1)*34+Math.sin(frames*0.011+i)*3;
    const wx=x+fcamX, wy=y+fcamY; return freg(Math.floor(wx/TS),Math.floor(wy/TS))==='sky'&&!fsolid(wx,wy)?[x,y]:null; });
}

/* ---------- Loop ---------- */
syncPicks(); newWorld();
let last=performance.now(), acc=0;
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ step(); acc-=1000/60; }
  render(); if(!intro.hidden) animPorts(); if(NIGHT&&state==='play'&&frames%1500===800) owl(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
