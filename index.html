<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Come Bye – ein Pixel-Hütespiel mit Border Collies: Schafe hüten, Agility laufen und den Hof erkunden.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Come Bye</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen portrait game — HUD strip, framed pixel meadow, wooden command pad */
:root{
  --sky:#cfe3c4;
  --ink:#3a2a1f;
  --cream:#f6efd9;
  --wood:#a0714a;
  --wood-dk:#5e3f28;
  --sun:#f2c14e;
  --rose:#e98fa3;
  --muted:#7a6a55;
  --font-pix:"Pixelify Sans","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-pix);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.06em;margin-right:auto;line-height:1}
.logo small{display:block;font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:2px}
.stat{font-size:14px;font-variant-numeric:tabular-nums;background:var(--cream);border:2px solid var(--wood-dk);padding:3px 7px;line-height:1.1}
.calm{display:flex;align-items:center;gap:5px}
.calm .bar{display:flex;gap:1px}
.calm .bar i{width:5px;height:10px;background:#d8ccb0}
.calm .bar i.on{background:var(--sun)}
.calm .bar.low i.on{background:var(--rose)}
.icon-btn{font:inherit;font-size:13px;background:var(--cream);color:var(--ink);border:2px solid var(--wood-dk);padding:3px 7px;cursor:pointer}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#field,#side,#farm{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid var(--wood-dk);
  box-shadow:0 0 0 2px var(--wood),0 6px 0 2px #8fae7f;background:#9cc46b;cursor:crosshair;max-width:100%}

.bubble{position:absolute;top:10px;left:50%;transform:translate(-50%,-6px) scale(.8);opacity:0;pointer-events:none;z-index:3;
  background:var(--cream);border:3px solid var(--ink);padding:6px 12px 5px;text-align:center;transition:transform .15s steps(3),opacity .1s;
  box-shadow:3px 3px 0 rgba(58,42,31,.35);white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:8px;height:8px;background:var(--cream);border:3px solid var(--ink);
  border-top:none;border-left:none;transform:translateX(-50%) rotate(45deg)}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble b{display:block;font-size:22px;font-weight:700;letter-spacing:.02em}
.bubble span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.card{position:absolute;z-index:2;width:min(330px,94%);max-height:calc(100% - 8px);overflow:auto;box-sizing:border-box;background:var(--cream);border:4px solid var(--wood-dk);
  box-shadow:6px 6px 0 rgba(58,42,31,.3);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card[hidden]{display:none}
[hidden]{display:none!important}
.pad.agi{grid-template-columns:repeat(4,1fr)}
.cmd.reset{background:#efe4c6}
.fpad{display:grid;grid-template-columns:116px 1fr 1.25fr;gap:8px;padding-bottom:6px}
.dpad{height:104px;box-sizing:border-box;background:var(--cream);border:3px solid var(--wood-dk);box-shadow:0 4px 0 var(--wood-dk);display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);grid-template-areas:". u ." "l . r" ". d .";touch-action:none;cursor:pointer}
.dp{display:grid;place-items:center;color:var(--muted);pointer-events:none}
.dp svg{width:14px;height:14px;fill:currentColor}
.dp.u{grid-area:u}.dp.l{grid-area:l}.dp.r{grid-area:r}.dp.d{grid-area:d}
.dp.on{background:var(--sun);color:var(--ink)}
.fpad .cmd{min-height:104px;box-sizing:border-box;justify-content:center}
.fpad .cmd b{font-size:18px}
.cmd.fjump{background:#fff3c4}
.cmd.held{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
.card h2{margin:0;font-size:24px;letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.45}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{font:inherit;color:var(--ink);background:#efe4c6;border:3px solid var(--wood-dk);padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pick canvas{width:100%;max-width:96px;height:auto;aspect-ratio:12/5;image-rendering:pixelated;image-rendering:crisp-edges}
.pup{font:inherit;color:var(--ink);background:#efe4c6;border:3px solid var(--wood-dk);padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.pup canvas{width:80px;height:32px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
.pup span{font-size:14px;line-height:1.3;min-width:0}
.pup small{display:block;font-size:11px;color:var(--muted)}
.pup[aria-pressed="true"]{background:var(--sun)}
.pick b{font-size:15px}
.pick[aria-checked="true"]{background:var(--sun);box-shadow:inset 0 -4px 0 rgba(94,63,40,.25)}
.traits{min-height:2.9em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:#efe4c6;border:2px solid var(--wood-dk);padding:4px 8px;cursor:pointer}
.chip[aria-checked="true"]{background:var(--sun)}
.help{font-size:13px!important;color:var(--muted)}
.go{font:inherit;font-weight:700;font-size:17px;background:var(--sun);color:var(--ink);border:3px solid var(--wood-dk);
  box-shadow:0 4px 0 var(--wood-dk);padding:9px;cursor:pointer;margin-top:2px}
.go.alt{background:#efe4c6;font-size:15px;padding:7px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
.stars{font-size:26px;letter-spacing:4px;color:var(--sun);text-shadow:2px 2px 0 var(--wood-dk)}
.stars .off{color:#d8ccb0}
.res{display:flex;gap:8px}
.res .stat{flex:1;text-align:center;font-size:15px}
.res .stat small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding-bottom:6px}
.cmd{font:inherit;background:var(--cream);color:var(--ink);border:3px solid var(--wood-dk);box-shadow:0 4px 0 var(--wood-dk);
  padding:7px 1px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cmd b{font-size:14px;font-weight:700;white-space:nowrap}
.cmd span{font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.cmd.active{background:var(--sun)}
.cmd.bark{background:#f3d3d9}
.cmd.cool{opacity:.45}
.cmd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
@media (max-width:420px){.cmd b{font-size:12px}.cmd span{font-size:8px}.logo small{font-size:10px}}
@media (prefers-reduced-motion:reduce){.bubble{transition:none}}
</style>
</head>
<body>


<div class="app">
  <header class="hud">
    <div class="logo">COME BYE<small id="sub">Ein Hüte-Prototyp</small></div>
    <div class="stat" id="count">0/10 im Gatter</div>
    <div class="stat calm" id="calmStat" title="Ruhe der Herde">Ruhe <span class="bar" id="calmBar"></span></div>
    <div class="stat" id="faults" hidden>Fehler 0</div>
    <div class="stat" id="time">0:00</div>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false">Ton an</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="field" aria-label="Weide mit Schafen, Collie und Gatter"></canvas>
    <canvas id="side" aria-label="Agility-Seitenlauf mit Collie" hidden></canvas>
    <canvas id="farm" aria-label="Der Hof zum Erkunden" hidden></canvas>
    <div class="bubble" id="bubble" aria-live="polite"><b id="bSim"></b><span id="bEn"></span></div>

    <div class="card" id="intro">
      <h2>Wer ist heute dran?</h2>
      <div class="label">Spielmodus</div>
      <div class="chips" role="radiogroup" aria-label="Spielmodus wählen">
        <button class="chip" type="button" role="radio" data-mode="herd" id="m-herd">Hüten</button>
        <button class="chip" type="button" role="radio" data-mode="agility" id="m-agility">Agility</button>
        <button class="chip" type="button" role="radio" data-mode="side" id="m-side">Seitenlauf</button>
        <button class="chip" type="button" role="radio" data-mode="farm" id="m-farm">Hof</button>
      </div>
      <div class="picks" role="radiogroup" aria-label="Collie wählen">
        <button class="pick" type="button" role="radio" data-dog="nala" id="p-nala"><canvas width="24" height="10"></canvas><b>Nala</b></button>
        <button class="pick" type="button" role="radio" data-dog="juni" id="p-juni"><canvas width="24" height="10"></canvas><b>Juni</b></button>
        <button class="pick" type="button" role="radio" data-dog="fly" id="p-fly"><canvas width="24" height="10"></canvas><b>Fly</b></button>
      </div>
      <p class="traits" id="traits"></p>
      <button class="pup" type="button" id="pupBtn" aria-pressed="false"><canvas width="20" height="8" id="pupCv"></canvas><span><b>Moxy</b> kommt mit<small>Junghund. Macht nichts, ist aber niedlich.</small></span></button>
      <div class="label">Jahreszeit</div>
      <div class="chips" role="radiogroup" aria-label="Jahreszeit wählen">
        <button class="chip" type="button" role="radio" data-season="random" id="s-random">Zufall</button>
        <button class="chip" type="button" role="radio" data-season="spring" id="s-spring">Frühling</button>
        <button class="chip" type="button" role="radio" data-season="summer" id="s-summer">Sommer</button>
        <button class="chip" type="button" role="radio" data-season="autumn" id="s-autumn">Herbst</button>
        <button class="chip" type="button" role="radio" data-season="winter" id="s-winter">Winter</button>
      </div>
      <div class="label">Tageszeit</div>
      <div class="chips" role="radiogroup" aria-label="Tageszeit wählen">
        <button class="chip" type="button" role="radio" data-time="day" id="t-day">Tag</button>
        <button class="chip" type="button" role="radio" data-time="night" id="t-night">Nacht</button>
      </div>
      <p class="help" id="help"></p>
      <button class="go" id="start" type="button">Pfeif los</button>
    </div>

    <div class="card" id="win" hidden>
      <h2 id="winTitle">Dat-lu-duu!</h2>
      <p id="winText">That'll do. Alle Schafe sind im Gatter.</p>
      <div class="stars" id="stars"></div>
      <div class="res">
        <div class="stat"><small id="rL1">Zeit</small><span id="rV1">0:00</span></div>
        <div class="stat"><small id="rL2">Ruhe</small><span id="rV2">0%</span></div>
        <div class="stat" id="r3" hidden><small id="rL3">Gesamt</small><span id="rV3"></span></div>
      </div>
      <button class="go" id="again" type="button">Neue Weide</button>
      <button class="go alt" id="change" type="button">Hund oder Jahreszeit wechseln</button>
    </div>
  </div>

  <nav class="fpad" id="padFarm" aria-label="Hof-Steuerung" hidden>
    <div class="dpad" id="dpad" role="group" aria-label="Steuerkreuz">
      <span class="dp u"><svg viewBox="0 0 10 10"><path d="M5 1 9 8H1z"/></svg></span>
      <span class="dp l"><svg viewBox="0 0 10 10"><path d="M1 5 8 1v8z"/></svg></span>
      <span class="dp r"><svg viewBox="0 0 10 10"><path d="M9 5 2 1v8z"/></svg></span>
      <span class="dp d"><svg viewBox="0 0 10 10"><path d="M5 9 9 2H1z"/></svg></span>
    </div>
    <button class="cmd bark" type="button" id="f-bark"><b>Wuff!</b><span>BELLEN</span></button>
    <button class="cmd fjump" type="button" id="f-jump"><b>Hopp!</b><span>HALTEN = HÖHER</span></button>
  </nav>
  <nav class="pad agi" id="padSide" aria-label="Seitenlauf-Kommandos" hidden>
    <button class="cmd" type="button" id="x-jump"><b>Hopp!</b><span>HALTEN = HÖHER</span></button>
    <button class="cmd" type="button" id="x-slow"><b>Langsam</b><span>HALTEN</span></button>
    <button class="cmd" type="button" id="x-down"><b>Lie down</b><span>TISCH</span></button>
    <button class="cmd reset" type="button" id="x-reset"><b>Neustart</b><span>GLEICHER LAUF</span></button>
  </nav>
  <nav class="pad agi" id="padAgi" aria-label="Agility-Kommandos" hidden>
    <button class="cmd" type="button" data-acmd="hopp" id="a-hopp"><b>Hopp!</b><span>SPRUNG</span></button>
    <button class="cmd" type="button" data-acmd="slow" id="a-slow"><b>Langsam</b><span>KONTAKTZONE</span></button>
    <button class="cmd" type="button" data-acmd="down" id="a-down"><b>Lie down</b><span>TISCH</span></button>
    <button class="cmd reset" type="button" data-acmd="reset" id="a-reset"><b>Neustart</b><span>GLEICHER LAUF</span></button>
  </nav>
  <nav class="pad" id="padHerd" aria-label="Hütekommandos">
    <button class="cmd" type="button" data-cmd="comebye" id="c-comebye"><b>Come bye</b><span>↻ KUM-BAAI</span></button>
    <button class="cmd" type="button" data-cmd="away" id="c-away"><b>Away</b><span>↺ AWÉ-TA-MII</span></button>
    <button class="cmd" type="button" data-cmd="walk" id="c-walk"><b>Walk up</b><span>WÓLA-PUP</span></button>
    <button class="cmd" type="button" data-cmd="down" id="c-down"><b>Lie down</b><span>LAI-DUNN</span></button>
    <button class="cmd bark" type="button" data-cmd="wuff" id="c-wuff"><b>Wuff!</b><span>NOTFALL</span></button>
  </nav>
</div>

<script>
(function(){
const LW=160, LH=240;
const cv=document.getElementById('field'), ctx=cv.getContext('2d');
cv.width=LW; cv.height=LH; ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');
function fit(){
  const r=stage.getBoundingClientRect();
  let s=Math.min((r.width-12)/LW,(r.height-14)/LH);
  if(s>=2) s=Math.floor(s*4)/4;
  s=Math.max(s,1);
  cv.style.width=Math.floor(LW*s)+'px'; cv.style.height=Math.floor(LH*s)+'px';
}
addEventListener('resize',fit); fit();

/* ---------- RNG ---------- */
let seed=Date.now()%100000;
function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const pick=a=>a[(rnd()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Seasons ---------- */
const SEASONS={
  spring:{label:'Frühling',grass:'#9fcf6c',mott:['#97c864','#aad87a','#8fc05c','#b0dc84'],tuft:['#7cad4c','#8cbd5a'],trail:'#b6d88a',pen:'#b4d88a',
    flowers:['#f2a7b5','#ffffff','#f5e6a8','#c9b3e8'],nFlowers:95,crown:['#70ab55','#4f8a43','#9ccf74','#3f7437'],blossom:'#f6bfd0',
    water:['#86c4d4','#66aac1','#4f93ad'],rim:'#6fa04a',bush:['#4f8a43','#6aa756','#f2a7b5'],shadow:'rgba(46,72,26,.28)',ambient:'petal'},
  summer:{label:'Sommer',grass:'#9cc46b',mott:['#93bc62','#a6cc75','#8db55c','#a1c870'],tuft:['#78a04b','#86ae56'],trail:'#b3cf83',pen:'#b4d283',
    flowers:['#f5e6a8','#f2a7b5','#ffffff','#c9b3e8'],nFlowers:55,crown:['#62a050','#4f8a43','#8cc26a','#3f7437'],
    water:['#86c4d4','#66aac1','#4f93ad'],rim:'#6f9a4a',bush:['#4f8a43','#6aa756','#e98fa3'],shadow:'rgba(46,72,26,.28)',ambient:'butterfly'},
  autumn:{label:'Herbst',grass:'#a9b466',mott:['#a0ab5e','#b4bd70','#98a256','#c0b56a'],tuft:['#86904a','#9a8a44'],trail:'#bcb878',pen:'#bdbf78',
    flowers:['#e0a34a','#c8643c','#d9822e'],nFlowers:40,crown:['#d9822e','#a8501f','#efb24c','#7e3c1a'],mushrooms:true,
    water:['#7fb1bd','#5f97a8','#4b8296'],rim:'#7d8a44',bush:['#8a4a22','#b8642c','#e0a34a'],shadow:'rgba(70,60,26,.28)',ambient:'leaf'},
  winter:{label:'Winter',grass:'#e9f0f2',mott:['#dde7eb','#f5f9fa','#d3dfe4','#ffffff'],tuft:['#b9c9cf','#c9d6db'],trail:'#d3dfe4',pen:'#f6f9fa',
    flowers:[],nFlowers:0,crown:['#3f6f52','#2d5640','#5a8a66','#24463a'],snowcap:'#ffffff',ice:true,
    water:['#d7ecf3','#bfdde8','#a8cddb'],rim:'#b9c9cf',bush:['#7f9aa3','#ffffff','#c9d6db'],shadow:'rgba(70,95,115,.25)',ambient:'snow'}
};
let seasonChoice='random', SEASON=SEASONS.summer;

/* ---------- Sprites ---------- */
function sprite(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)), h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  rows.forEach((r,y)=>{[...r].forEach((ch,x)=>{ if(pal[ch]){g.fillStyle=pal[ch]; g.fillRect(x,y,1,1);} });});
  const f=document.createElement('canvas'); f.width=w; f.height=h; const fg=f.getContext('2d');
  fg.translate(w,0); fg.scale(-1,1); fg.drawImage(c,0,0);
  return {r:c,l:f,w,h};
}
const SHEEP_ROWS=[
  ["..wwwww...",".wwwwwww..","wwwwwwwkkk","swwwwwwkk.",".sssssss..","..k....k.."],
  ["..wwwww...",".wwwwwww..","wwwwwwwkkk","swwwwwwkk.",".sssssss..","...k..k..."],
  ["..wwwww...",".wwwwwww..","wwwwwwww..","swwwwwwwkk",".sssssskkk","..k....k.."]
];
const sheepSpr=SHEEP_ROWS.map(r=>sprite(r,{w:'#f7f3e6',s:'#cfc4aa',k:'#3b302a'}));

const DOGS={
  nala:{name:'Nala',traits:'Grau, schnell und klug. Bremst von selbst ab, sobald sie den Schafen nahe kommt.',
    pal:{k:'#9aa1a8',d:'#5d656e',w:'#f4efe4',n:'#1c1716',t:'#e9788e'},
    run:[["........k.k.","w.......kkkk",".kkdkkkkwwkn","..kkkddkww..","..w.k..w.k.."],
         ["........k.k.","w.......kkkk",".kkdkkkkwwkn","..kkkddkwwt.","...wk...wk.."]],
    down:["............","........k.k.","w.......kkkk",".kkdkkkkwwkn","..wwkddkwww."],
    max:1.85,circ:1.45,accel:.24,flee:34,stress:.8,smart:true,bark:640,call:[{c:'n',v:'a'},{c:'l',v:'a',p:1.2}],
    agiSpd:1.05,agiF:{bar:.35,contact:.35,weave:0,early:0},agi:'Im Parcours: der Slalom sitzt immer.'},
  juni:{name:'Juni',traits:'Schwarz, etwas größer und brav. Gemütliches Tempo, die Herde bleibt entspannt.',
    pal:{k:'#221d1c',w:'#f4efe4',n:'#0d0908',t:'#e9788e'},
    run:[[".........k.k..","w........kkkk.",".kkkkkkkkkkwkn","..kkkkkkkkww..","..kkkkkkkww...","..w.k...w.k..."],
         [".........k.k..","w........kkkk.",".kkkkkkkkkkwkn","..kkkkkkkkww..","..kkkkkkkwwt..","...wk....wk..."]],
    down:["..............",".........k.k..","w........kkkk.",".kkkkkkkkkkwkn","..kkkkkkkkww..","..wwkkkkkwww.."],
    max:1.45,circ:1.2,accel:.16,flee:37,stress:.55,brav:true,bark:520,call:[{c:'d',v:'u'},{c:'n',v:'i',p:1.2}],
    agiSpd:.85,agiF:{bar:.2,contact:.1,weave:.3,early:0},agi:'Im Parcours: trifft zuverlässig die Kontaktzonen.'},
  fly:{name:'Fly',traits:'Schwarz-braun, der Größte und sehr schnell. Frech: macht manchmal sein eigenes Ding.',

function makeTree(S){

    const dx=x-7,dy=y-7,d=Math.hypot(dx,dy*1.05);

function genMap(){

    left?{x:53,y:0,w:3,h:56}:{x:103,y:0,w:3,h:56},

  INNER=left?{x0:9,x1:51,y0:9,y1:50}:{x0:108,x1:152,y0:9,y1:50};
  PEN={x:left?6:106,y:7,w:47,h:46};

/* ---------- Collision ---------- */
function pushCircleRect(e,r,R){
  const cx=clamp(e.x,R.x,R.x+R.w), cy=clamp(e.y,R.y,R.y+R.h);
  let dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy);
  if(d===0){
    const l=e.x-R.x, rr=R.x+R.w-e.x, t=e.y-R.y, bb=R.y+R.h-e.y, m=Math.min(l,rr,t,bb);
    if(m===l) e.x=R.x-r; else if(m===rr) e.x=R.x+R.w+r; else if(m===t) e.y=R.y-r; else e.y=R.y+R.h+r;
    return true;
  }
  if(d<r){ e.x=cx+dx/d*r; e.y=cy+dy/d*r; return true; }
  return false;
}
const inPond=(e,r)=>Math.hypot((e.x-POND.x)/(POND.rx+r),(e.y-POND.y)/(POND.ry+r))<1;
function collide(e,r,isDog){
  for(const f of FENCE) if(pushCircleRect(e,r,f)){ e.vx*=.5; e.vy*=.5; }
  for(const t of TREES){ const dx=e.x-t.x, dy=e.y-(t.y-1), d=Math.hypot(dx,dy)||1, m=r+3.5; if(d<m){ e.x=t.x+dx/d*m; e.y=t.y-1+dy/d*m; } }
  if(!SEASON.ice && !isDog && inPond(e,r)){ // sheep stay out of the water; collies may swim
    const k=1/(Math.hypot((e.x-POND.x)/(POND.rx+r),(e.y-POND.y)/(POND.ry+r))||1);
    e.x=POND.x+(e.x-POND.x)*k; e.y=POND.y+(e.y-POND.y)*k; e.vx*=.7; e.vy*=.7;
  }
  // collies may hug the edge more tightly than sheep, so they can slip behind a cornered sheep
  const m=isDog?3:7;
  e.x=clamp(e.x,m,LW-m); e.y=clamp(e.y,isDog?4:9,LH-(isDog?2:6));
}
const inPen=s=>s.x>INNER.x0&&s.x<INNER.x1&&s.y>INNER.y0&&s.y<INNER.y1;

/* ---------- Update ---------- */
function herdCenter(){
  let list=sheep.filter(s=>!inPen(s)); if(!list.length) list=sheep;
  let x=0,y=0; list.forEach(s=>{x+=s.x;y+=s.y}); x/=list.length; y/=list.length;
  let spread=0; list.forEach(s=>{spread=Math.max(spread,Math.hypot(s.x-x,s.y-y))});
  return {x,y,spread,list};
}
function spray(x,y,n,cols){ for(let i=0;i<n;i++) fx.push({x,y,vx:(rnd()-.5)*1.2,vy:-rnd()*.9,c:pick(cols||['#d8f1f6','#9fd3e2']),life:22+rnd()*10,g:.05}); }
function updateDog(){
  if(dog.shake>0){ // standing still on the shore, shaking off the water
    dog.shake--; dog.vx*=.5; dog.vy*=.5; dog.x+=dog.vx; dog.y+=dog.vy; dog.spd=0;
    if(dog.shake%2===0) spray(dog.x+(rnd()-.5)*8,dog.y-3,3);
    return;
  }
  const D=dog.D, H=herdCenter();
  let near=1e9; H.list.forEach(s=>{near=Math.min(near,Math.hypot(s.x-dog.x,s.y-dog.y))});
  if(dog.delay>0 && --dog.delay===0 && dog.pending){ dog.mode=dog.pending; dog.pending=null; }
  let tx=dog.x, ty=dog.y, maxs=D.max;
  if(D.cheeky && state==='play' && !(dog.zoom>0) && dog.mode!=='down' && rnd()<.0013){
    const cand=sheep.filter(s=>!inPen(s));
    if(cand.length){ const s=pick(cand); dog.zoom=50; dog.zx=s.x; dog.zy=s.y; bark(); bubble('Flaai…!','Fly, nein!'); }
  }
  if(dog.zoom>0){ dog.zoom--; tx=dog.zx; ty=dog.zy; }
  else if(dog.mode==='go'){ tx=dog.tx; ty=dog.ty; if(Math.hypot(tx-dog.x,ty-dog.y)<1.5 && !dragging) dog.mode='stand'; }
  else if(dog.mode==='circle'){
    let ang=Math.atan2(dog.y-H.y,dog.x-H.x);
    const R=clamp(H.spread+20,26,72);
    ang+=dog.dir*.05; tx=H.x+Math.cos(ang)*R; ty=H.y+Math.sin(ang)*R; maxs=D.circ;
  } else if(dog.mode==='walk'){ if(near>15){ tx=H.x; ty=H.y; } maxs=.55; }
  if(!(dog.zoom>0)){ if(D.smart&&near<16) maxs=Math.min(maxs,1); if(D.brav&&near<18) maxs=Math.min(maxs,.85); }
  const onPond=inPond(dog,0), wet=onPond&&!SEASON.ice, ice=onPond&&SEASON.ice;
  if(wet) maxs*=.55;
  const dx=tx-dog.x, dy=ty-dog.y, d=Math.hypot(dx,dy);
  const want=Math.min(maxs,d*.12), wx=d?dx/d*want:0, wy=d?dy/d*want:0;
  const acc=D.accel*(ice?.3:1);
  dog.vx+=(wx-dog.vx)*acc; dog.vy+=(wy-dog.vy)*acc;
  if(dog.mode==='down'&&!(dog.zoom>0)){ const f=ice?.97:.7; dog.vx*=f; dog.vy*=f; }
  dog.x+=dog.vx; dog.y+=dog.vy; collide(dog,2.5,true);
  dog.spd=Math.hypot(dog.vx,dog.vy);
  if(Math.abs(dog.vx)>.05) dog.face=dog.vx>0?1:-1;
  dog.anim+=dog.spd*.35;
  if(wet&&!dog.wet){ splash(); spray(dog.x,dog.y-2,10); }
  if(!wet&&dog.wet){ dog.shake=30; dog.zoom=0; brrr(1); }
  dog.wet=wet;
}
let lastBleat=0;
function updateSheep(){
  const D=dog.D;
  for(const s of sheep){
    let ax=0,ay=0;
    const dx=s.x-dog.x, dy=s.y-dog.y, dd=Math.hypot(dx,dy)||1, FLEE=D.flee;
    if(dd<FLEE && dog.mode!=='down'){
      const f=1-dd/FLEE;
      let fx_=dx/dd*f*.09*s.shy, fy_=dy/dd*f*.09*s.shy;
      // at a wall, turn the push into a sideways slide instead of pressing the sheep into it
      const E=14;
      if((s.x<E&&fx_<0)||(s.x>LW-E&&fx_>0)){ fy_+=Math.sign(fy_||(s.y<LH/2?1:-1))*Math.abs(fx_); fx_*=-.3; }
      if(((s.y<E&&fy_<0)&&!inPen(s))||(s.y>LH-E&&fy_>0)){ fx_+=Math.sign(fx_||(s.x<LW/2?1:-1))*Math.abs(fy_); fy_*=-.3; }
      ax+=fx_; ay+=fy_;
      s.alert=Math.min(1,s.alert+.05*f+.01);
      if(dog.spd>1.05) s.stress=Math.min(1,s.stress+.014*f*dog.spd*D.stress);
      if(dd<7) s.stress=Math.min(1,s.stress+.01*D.stress);
    } else if(dd<FLEE){ s.alert=Math.min(1,s.alert+.004); }
    else s.alert*=.985;
    let cx=0,cy=0,n=0,sx=0,sy=0,vx=0,vy=0;
    for(const o of sheep){ if(o===s) continue; const ox=s.x-o.x, oy=s.y-o.y, d=Math.hypot(ox,oy);
      if(d<26){ cx+=o.x; cy+=o.y; vx+=o.vx; vy+=o.vy; n++; }
      if(d<7){ const k=(7-d)/7/(d||1); sx+=ox*k; sy+=oy*k; } }
    if(n){ const coh=s.stubborn?.0006:.0016;
      ax+=(cx/n-s.x)*coh*(.25+s.alert); ay+=(cy/n-s.y)*coh*(.25+s.alert);
      ax+=(vx/n-s.vx)*.04*s.alert; ay+=(vy/n-s.vy)*.04*s.alert; }
    ax+=sx*.07; ay+=sy*.07;
    const E=14;
    if(!inPen(s)){
      if(s.x<E) ax+=(E-s.x)*.005; else if(s.x>LW-E) ax-=(s.x-(LW-E))*.005;
      if(s.y<E) ay+=(E-s.y)*.005; else if(s.y>LH-E) ay-=(s.y-(LH-E))*.005;
    }
    if(--s.wt<=0){ s.wt=(50+rnd()*(s.stubborn?120:200))|0; s.wa=rnd()*6.283; s.graze=rnd()<(s.stubborn?.35:.6); }
    if(!s.graze && s.alert<.35){ const w=s.stubborn?.014:.006; ax+=Math.cos(s.wa)*w; ay+=Math.sin(s.wa)*w; }
    s.vx+=ax; s.vy+=ay;
    const ice=SEASON.ice&&inPond(s,0);
    let max=.22+s.alert*.7+s.stress*.65+(ice?.25:0);
    if(s.bolt>0){ s.bolt--; max=Math.max(max,1.6); }
    const sp=Math.hypot(s.vx,s.vy);
    if(sp>max){ s.vx*=max/sp; s.vy*=max/sp; }
    const fr=ice?.988:s.alert>.3?.955:.92; s.vx*=fr; s.vy*=fr;
    s.x+=s.vx; s.y+=s.vy; collide(s,3,false);
    if(Math.abs(s.vx)>.03) s.face=s.vx>0?1:-1;
    s.anim+=Math.hypot(s.vx,s.vy)*.5;
    s.stress=Math.max(0,s.stress-.0016);
    const now=performance.now();
    if(now-lastBleat>900 && ((s.stress>.45&&rnd()<.01)||rnd()<.0005)){ lastBleat=now; bleat(s); }
  }
}
function updateAmbient(){
  const S=SEASON;
  if(S.ambient==='snow' && rnd()<.35) amb.push({x:rnd()*LW,y:-2,vx:0,vy:.22+rnd()*.3,ph:rnd()*6,c:'#ffffff',k:'snow'});
  if(S.ambient==='leaf' && rnd()<.04) amb.push({x:rnd()*LW-20,y:-2,vx:.25+rnd()*.3,vy:.3+rnd()*.2,ph:rnd()*6,c:pick(['#d9822e','#a8501f','#efb24c']),k:'leaf'});
  if(S.ambient==='petal' && rnd()<.035) amb.push({x:rnd()*LW-20,y:-2,vx:.2+rnd()*.2,vy:.25+rnd()*.15,ph:rnd()*6,c:pick(['#f6bfd0','#ffffff']),k:'petal'});
  if(S.ambient==='butterfly' && amb.length<3) amb.push({x:rnd()*LW,y:60+rnd()*160,vx:0,vy:0,ph:rnd()*6,c:pick(['#fff3a8','#ffffff','#f6bfd0']),k:'fly'});
  amb.forEach(p=>{
    if(p.k==='fly'){ p.vx+=(rnd()-.5)*.08; p.vy+=(rnd()-.5)*.08; p.vx*=.96; p.vy*=.96; p.x=clamp(p.x+p.vx,2,LW-2); p.y=clamp(p.y+p.vy,10,LH-4); }
    else { p.x+=p.vx+Math.sin(p.ph+frames*.05)*.25; p.y+=p.vy; }
  });
  amb=amb.filter(p=>p.y<LH+2&&p.x<LW+4);
}
function step(){
  if(MODE==='farm'){ stepFarm(); return; }
  if(MODE==='side'){ stepSide(); return; }
  if(MODE==='agility'){ stepAgi(); return; }
  if(state==='play'||state==='win'){ updateDog(); updateSheep(); }
  updatePup();
  updateAmbient();
  if(state==='play'){
    frames++;
    const calm=1-sheep.reduce((a,s)=>a+s.stress,0)/sheep.length;
    calmAcc+=calm; calmN++;
    const c=sheep.filter(inPen).length;
    if(frames%6===0) hud(c,calm);
    if(c===sheep.length){ if(++inFrames>45) win(); } else inFrames=0;
  } else frames++;
  fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||.02;p.life--;}); fx=fx.filter(p=>p.life>0&&p.y<LH);
}

/* ---------- Render ---------- */
function shadow(x,y,w){ ctx.fillStyle=SEASON.shadow; ctx.fillRect(x-(w>>1),y,w,1); ctx.fillRect(x-(w>>1)+1,y+1,w-2,1); }
function render(){
  if(MODE==='farm'){ renderFarm(); return; }
  if(MODE==='side'){ renderSide(); return; }
  if(MODE==='agility'){ renderAgi(); return; }
  ctx.drawImage(bg,0,0);
  const ents=[];
  TREES.forEach(t=>ents.push({y:t.y,draw:()=>{ shadow(t.x|0,t.y|0,10); ctx.drawImage(treeImgs[t.v],Math.round(t.x-7),Math.round(t.y-19)); }}));
  sheep.forEach(s=>ents.push({y:s.y,draw:()=>{
    const x=Math.round(s.x), y=Math.round(s.y);
    shadow(x,y,8);
    const moving=Math.hypot(s.vx,s.vy)>.05;
    const f=moving?((s.anim|0)%2):(s.graze&&s.alert<.2?2:0);
    const sp=sheepSpr[f], img=s.face>0?sp.r:sp.l;
    const bob=(s.stress>.5&&(frames>>2)%2)?1:0;
    ctx.drawImage(img,x-5,y-6-bob);
    if(s.stubborn){ ctx.fillStyle='#e98fa3'; const hx=s.face>0?x+2:x-4; ctx.fillRect(hx,y-7-bob,2,1); ctx.fillRect(hx+(s.face>0?1:0),y-8-bob,1,1); }
    if(s.stress>.6&&(frames>>3)%2){ ctx.fillStyle='#ffffff'; ctx.fillRect(x+(s.face>0?5:-6),y-9,1,2); }
  }}));
  ents.push({y:dog.y,draw:()=>{
    const D=dog.D, x=Math.round(dog.x), y=Math.round(dog.y);
    tickIdle(dog,dog.spd<0.08&&!dog.wet&&!(dog.shake>0)&&!(dog.zoom>0)&&(state!=='play'||dog.mode==='stand'||dog.mode==='down'));
    const ip=idlePose(dog,D.spr);
    const sp=dog.mode==='down'&&dog.spd<.2&&!dog.wet?D.spr.down:D.spr.run[dog.spd>.15?((dog.anim|0)%2):0];
    const img=dog.face>0?sp.r:sp.l, w=sp.w, h=sp.h, x0=x-(w>>1);
    if(dog.wet){
      const vis=h-3, bob=(frames>>4)%2;

      ctx.fillStyle='#e6f6fa'; const p=(frames>>3)%3;

    } else if(ip){ shadow(x,y,ip.fr.w-3); drawPoseArt(ctx,ip.fr,dog.face,x,y-(ip.dy||0),ip.rot); }
    else { const j=dog.shake>0?((dog.shake>>1)%2?1:-1):0; shadow(x,y,w-3); ctx.drawImage(img,x0+j,y-h); }
  }});
  if(pupOn&&pup) ents.push({y:pup.y,draw:drawPup});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  if(dog.mode==='go'&&state==='play'){ ctx.fillStyle='rgba(255,255,255,.75)'; const tx=Math.round(dog.tx),ty=Math.round(dog.ty);
    ctx.fillRect(tx-2,ty,1,1);ctx.fillRect(tx+2,ty,1,1);ctx.fillRect(tx,ty-2,1,1);ctx.fillRect(tx,ty+2,1,1); }

  if(NIGHT) nightHerd(false);
}
function drawParticles(){
  fx.forEach(p=>{ ctx.fillStyle=p.c; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); });
  amb.forEach(p=>{ ctx.fillStyle=p.c; const x=Math.round(p.x), y=Math.round(p.y);
    if(p.k==='leaf') ctx.fillRect(x,y,2,1);
    else if(p.k==='fly'){ if((frames+(p.ph*10|0))%12<6) ctx.fillRect(x-1,y,3,1); else ctx.fillRect(x,y,1,1); ctx.fillStyle='#3b302a'; ctx.fillRect(x,y+1,1,1); }
    else ctx.fillRect(x,y,1,1); });
}

/* ---------- Moxy, the puppy ---------- */
let pupOn=false, pup=null, lastYip=0;
function makePup(){ pup=pupOn&&dog?{x:clamp(dog.x-dog.face*9,4,LW-4),y:clamp(dog.y+3,6,LH-3),vx:0,vy:0,spd:0,face:dog.face,anim:0,state:'sit',timer:80,wet:false,elev:0,hop:0,ang:0}:null; }
function yip(){
  const now=performance.now(); if(now-lastYip<1500||!audio()) return; lastYip=now;
  [0,.12].forEach(dt=>{ const t=AC.currentTime+.01+dt, o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(1250,t); o.frequency.exponentialRampToValueAtTime(1900,t+.05);
    env(g,t,.004,.12,.03,.03); o.connect(g).connect(master); o.start(t); o.stop(t+.1); });
}
function pupIdle(P){
  P.timer=90+rnd()*160;
  const lying=dog.mode==='down'||(dog.table&&dog.table.count>=0);
  if(lying&&rnd()<.75){ P.state='flop'; return; }
  const r=rnd();
  if(r<.22){ P.state='sit'; }
  else if(r<.4){ P.state='flop'; }
  else if(r<.6){ P.state='sniff'; P.ox=clamp(P.x+(rnd()-.5)*30,6,LW-6); P.oy=clamp(P.y+(rnd()-.5)*20,8,LH-4); }
  else if(r<.8){ P.state='zoom'; P.ang=Math.atan2(P.y-dog.y,P.x-dog.x); P.timer=80; if(state==='play') yip(); }
  else {
    let best=null, bd=70; amb.forEach(a=>{ const d=Math.hypot(a.x-P.x,a.y-P.y); if(d<bd){bd=d;best=a;} });
    if(best){ P.state='chase'; P.prey=best; P.timer=150; } else P.state='sit';
  }
}
function updatePup(){
  if(!pupOn||!pup||!dog) return;
  if(pup.shake>0){ const P=pup; P.shake--; P.vx*=.5; P.vy*=.5; P.x+=P.vx; P.y+=P.vy; P.spd=0; if(P.shake%3===0) spray(P.x+(rnd()-.5)*6,P.y-2,2); return; }
  const P=pup, dogMoving=dog.spd>.35, dd=Math.hypot(dog.x-P.x,dog.y-P.y);
  if(dogMoving||dd>40){ if(P.state!=='follow'){ P.state='follow'; } }
  else if(P.state==='follow'&&dd<16){ P.state='sit'; P.timer=40+rnd()*80; }
  else if(P.state!=='follow'&&--P.timer<=0) pupIdle(P);
  let tx=P.x, ty=P.y, maxs=1.2, acc=.15;
  switch(P.state){
    case 'follow': tx=dog.x-dog.face*10; ty=dog.y+3; maxs=Math.min(2.3,dog.D.max*1.1); break;
    case 'sniff': tx=P.ox; ty=P.oy; maxs=.3; break;
    case 'zoom': P.ang+=.09; tx=dog.x+Math.cos(P.ang)*14; ty=dog.y+Math.sin(P.ang)*9; maxs=1.9; acc=.3; break;
    case 'chase':
      if(P.prey&&amb.includes(P.prey)){ tx=P.prey.x; ty=P.prey.y+5; maxs=1.5;
        if(Math.hypot(tx-P.x,ty-P.y)<4&&P.hop<=0){ P.hop=16; if(rnd()<.4) yip(); } }
      else { P.state='sit'; P.timer=60; }
      break;
  }
  const dx=tx-P.x, dy=ty-P.y, d=Math.hypot(dx,dy), want=Math.min(maxs,d*.12);
  P.vx+=((d?dx/d*want:0)-P.vx)*acc; P.vy+=((d?dy/d*want:0)-P.vy)*acc;
  if(P.state==='sit'||P.state==='flop'){ P.vx*=.7; P.vy*=.7; }
  P.x+=P.vx; P.y+=P.vy;
  if(MODE==='herd'){
    collide(P,2,true);
    const wet=!SEASON.ice&&inPond(P,0);
    if(wet&&!P.wet) spray(P.x,P.y-2,5);
    if(!wet&&P.wet){ P.shake=24; P.vx*=.3; P.vy*=.3; brrr(1.5); }
    P.wet=wet;
  } else { P.x=clamp(P.x,3,LW-3); P.y=clamp(P.y,5,LH-2); P.wet=false; }
  P.spd=Math.hypot(P.vx,P.vy);
  if(Math.abs(P.vx)>.05) P.face=P.vx>0?1:-1;
  else if(P.state==='sit'||P.state==='flop') P.face=dog.x>P.x?1:-1; // looks up to the big dog
  P.anim+=P.spd*.45;
  if(P.hop>0){ P.hop--; P.elev=Math.sin((1-P.hop/16)*Math.PI)*3; } else P.elev=0;
}
function drawPup(){
  if(!pupOn||!pup) return;
  const P=pup, S=MOXY.spr, x=Math.round(P.x), y=Math.round(P.y);
  tickIdle(P,P.spd<0.08&&!P.wet&&!(P.shake>0)&&!(P.elev>0)); const ip=idlePose(P,S);
  const fr=P.spd>.15?S.run[(P.anim|0)%2]:P.state==='flop'?S.down:S.wag[((frames>>2)+(P.state==='sniff'?1:0))%2];
  const img=P.face>0?fr.r:fr.l, w=fr.w, h=fr.h, e=Math.round(P.elev);
  if(P.wet){ const vis=h-2; ctx.drawImage(img,0,0,w,vis,x-(w>>1),y-h+2+((frames>>4)%2),w,vis);
    ctx.fillStyle='#e6f6fa'; ctx.fillRect(x-(w>>1)-1,y,2,1); ctx.fillRect(x+(w>>1),y,2,1); }
  else if(ip){ shadow(x,y,ip.fr.w-2); drawPoseArt(ctx,ip.fr,P.face,x,y-(ip.dy||0),ip.rot); }
  else { const j=P.shake>0?((P.shake>>1)%2?1:-1):0; shadow(x,y,w-2); ctx.drawImage(img,x-(w>>1)+j,y-h-e); }
}

/* ---------- Agility ---------- */
let MODE='herd', COURSE=[], curIdx=0, faults=0, timing=false, runFrames=0, lastHoppF=-1e9, lastSlowF=-1e9;
const OB={
  jump:   {L:2, W:18,name:'Hürde', spd:1.7},
  tire:   {L:2, W:18,name:'Reifen',spd:1.6},
  tunnel: {L:30,W:10,name:'Tunnel',spd:1.5, cue:'tunnel'},
  weave:  {L:28,W:4, name:'Slalom',spd:.8,  cue:'weave'},
  aframe: {L:30,W:10,name:'A-Wand',spd:.95, cue:'aframe', contact:true},
  dogwalk:{L:40,W:4, name:'Steg',  spd:1,   cue:'dogwalk',contact:true},
  seesaw: {L:32,W:4, name:'Wippe', spd:.85, cue:'seesaw', contact:true},
  table:  {L:12,W:12,name:'Tisch', spd:1,   cue:'table'}
};
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function walkPath(n,C,R){
  for(let tries=0;tries<300;tries++){
    const path=[[(rnd()*C)|0,R-1]], used=new Set([path[0].join()]);
    let ok=true;
    while(path.length<n){
      const [x,y]=path[path.length-1];
      const nb=DIRS.map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&a<C&&b>=0&&b<R&&!used.has(a+','+b));
      if(!nb.length){ ok=false; break; }
      const nx=pick(nb); path.push(nx); used.add(nx.join());
    }
    if(ok) return path;
  }
  return null;
}
function genCourse(){
  const C=3, R=4, CW=LW/C, CH=LH/R;
  let n=8+((rnd()*4)|0), path=null;
  while(!path){ path=walkPath(n,C,R); if(!path) n--; }
  const specials=shuffle(['tunnel','weave','aframe','dogwalk','seesaw','table','tire']);
  const k=Math.min(specials.length,n-3);
  const types=['jump'].concat(shuffle(specials.slice(0,k).concat(Array(n-1-k).fill('jump'))));
  COURSE=path.map((c,i)=>{
    const prev=path[i-1], next=path[i+1];
    const d=prev?[c[0]-prev[0],c[1]-prev[1]]:[next[0]-c[0],next[1]-c[1]];
    const kd=DIRS.findIndex(q=>q[0]===d[0]&&q[1]===d[1]);
    const [ux,uy]=DIRS[kd], T=OB[types[i]], jit=Math.round((rnd()-.5)*8);
    const cx=Math.round(c[0]*CW+CW/2)-uy*jit, cy=Math.round(c[1]*CH+CH/2)+ux*jit;
    const L=Math.max(T.L,3), horiz=kd%2===0;
    const bw=horiz?L:T.W, bh=horiz?T.W:L;
    const ob={type:types[i],k:kd,ux,uy,cx,cy,L:T.L,W:T.W,box:{x:cx-bw/2,y:cy-bh/2,w:bw,h:bh},done:false,knocked:false};
    const lx=-T.L/2, ly=-(T.W/2+6), sw=String(i+1).length*4+1;
    ob.sx=clamp(Math.round(cx+ux*lx-uy*ly-sw/2),2,LW-sw-2); ob.sy=clamp(Math.round(cy+uy*lx+ux*ly-3),2,LH-10);
    return ob;
  });
}
function buildAgiBg(){
  const b=bg.getContext('2d'), S=SEASON;
  b.fillStyle=S.grass; b.fillRect(0,0,LW,LH);
  for(let i=0;i<1400;i++){ b.fillStyle=S.mott[i%4]; b.fillRect((rnd()*LW)|0,(rnd()*LH)|0,1+(rnd()*2|0),1); }
  for(let i=0;i<110;i++){ const x=(rnd()*LW)|0,y=(rnd()*LH)|0; b.fillStyle=S.tuft[0]; b.fillRect(x,y,1,2); b.fillRect(x+2,y,1,2); b.fillStyle=S.tuft[1]; b.fillRect(x+1,y+1,1,1); }
  for(let i=0;i<(S.nFlowers>>1);i++){ const x=(rnd()*LW)|0,y=(rnd()*LH)|0; b.fillStyle=pick(S.flowers); b.fillRect(x,y,1,1); }
  // worn running line between the obstacles
  for(let i=0;i<COURSE.length-1;i++){
    const a=COURSE[i], c=COURSE[i+1], ea=a.L/2+4, ec=c.L/2+4;
    const x0=a.cx+a.ux*ea, y0=a.cy+a.uy*ea, x1=c.cx-c.ux*ec, y1=c.cy-c.uy*ec;
    const len=Math.hypot(x1-x0,y1-y0);
    for(let t=0;t<len;t+=1.5){ b.fillStyle=S.trail; b.fillRect((x0+(x1-x0)*t/len+rnd()*3-1.5)|0,(y0+(y1-y0)*t/len+rnd()*3-1.5)|0,1,1); }
  }
  // ring rope
  b.fillStyle='#ffffff';
  for(let x=2;x<LW-2;x+=4){ b.fillRect(x,1,2,1); b.fillRect(x,LH-2,2,1); }
  for(let y=2;y<LH-2;y+=4){ b.fillRect(1,y,1,2); b.fillRect(LW-2,y,1,2); }
}
function resetRun(){
  COURSE.forEach(o=>{o.done=false;o.knocked=false;});
  curIdx=0; faults=0; timing=false; runFrames=0; lastHoppF=lastSlowF=-1e9;
  const f=COURSE[0], back=f.L/2+18;
  const x=clamp(f.cx-f.ux*back,8,LW-8), y=clamp(f.cy-f.uy*back,10,LH-6);
  dog={x,y,vx:0,vy:0,mode:'stand',tx:x,ty:y,spd:0,face:f.ux<0?-1:1,anim:0,D:DOGS[chosen],perf:null,table:null,elev:0};
  fx=[]; makePup(); hudAgi();
}
function addFault(msg){ faults++; bubble('Uuups!',msg+' · +5 s'); knock(); hudAgi(); }
function startPerform(ob){
  const T=OB[ob.type], F=dog.D.agiF;
  if(!timing){ timing=true; runFrames=0; }
  const a=ob.L/2+4;
  const p={ob,t:0,x0:ob.cx-ob.ux*a,y0:ob.cy-ob.uy*a,x1:ob.cx+ob.ux*a,y1:ob.cy+ob.uy*a,steady:frames-lastSlowF<90};
  if(ob.type==='table'){ p.x1=ob.cx; p.y1=ob.cy; }
  p.dur=Math.max(12,Math.hypot(p.x1-p.x0,p.y1-p.y0)/(T.spd*dog.D.agiSpd));
  if(ob.type==='jump'||ob.type==='tire'){
    const hopp=frames-lastHoppF<90;
    if(rnd()<(hopp?F.bar*.15:F.bar)){ ob.knocked=true; addFault(ob.type==='tire'?'Reifen gestreift':'Stange gefallen'); }
  }
  if(ob.type==='weave' && rnd()<(dog.spd>1.4?F.weave:F.weave*.3)) addFault('Stange im Slalom verpasst');
  if(T.cue && !faultBubbleActive()) say(T.cue);
  dog.perf=p;
}
let lastFaultAt=0;
function faultBubbleActive(){ return document.getElementById('bSim').textContent==='Uuups!' && document.getElementById('bubble').classList.contains('on'); }
function elevation(type,t){
  if(type==='jump'||type==='tire') return Math.sin(Math.PI*t)*5;
  if(type==='aframe') return Math.max(0,1-Math.abs(t-.5)*2.4)*7;
  if(type==='dogwalk') return t<.3?t/.3*4:t<.7?4:Math.max(0,(1-t)/.3*4);
  if(type==='seesaw') return Math.max(0,1-Math.abs(t-.5)*2.2)*3;
  return 0;
}
function performStep(){
  const p=dog.perf, ob=p.ob, T=OB[ob.type];
  let inc=1/p.dur;
  if(T.contact && p.steady && p.t>.62) inc*=.55;
  p.t=Math.min(1,p.t+inc);
  const t=p.t; let x=p.x0+(p.x1-p.x0)*t, y=p.y0+(p.y1-p.y0)*t;
  if(ob.type==='weave' && t>.06 && t<.94){ const off=Math.sin((t-.06)/.88*Math.PI*6)*3; x+=-ob.uy*off; y+=ob.ux*off; }
  const px=dog.x, py=dog.y; dog.x=x; dog.y=y; dog.vx=x-px; dog.vy=y-py; dog.spd=Math.hypot(dog.vx,dog.vy);
  if(Math.abs(dog.vx)>.05) dog.face=dog.vx>0?1:-1;
  dog.anim+=dog.spd*.35;
  dog.elev=elevation(ob.type,t);
  if(t>=1){
    dog.perf=null; dog.elev=0;
    if(ob.type==='table'){ dog.table={ob,count:-1}; dog.mode='stand'; bubble('Lai-dunn?','Jetzt Lie down drücken'); return; }
    if(T.contact && !p.steady && rnd()<dog.D.agiF.contact) addFault('Kontaktzone verpasst');
    complete(ob);
  }
}
function tableStep(){
  const tb=dog.table; dog.vx=dog.vy=0; dog.spd=0; dog.elev=2;
  if(tb.count<0) return;
  tb.count++;
  if(tb.count===1||tb.count===41||tb.count===81) beep(tb.count===81?990:660);
  const end=()=>{ dog.table=null; dog.mode='stand'; dog.elev=0; complete(tb.ob); };
  if(dog.D.agiF.early && tb.count===50 && rnd()<dog.D.agiF.early){ addFault('Zu früh vom Tisch'); end(); return; }
  if(tb.count>=120) end();
}
function complete(ob){
  ob.done=true; curIdx++; chime();
  spray(dog.x,dog.y-4,6,['#f2c14e','#ffffff']);

function updateAgiDog(){
  if(dog.perf){ performStep(); return; }
  if(dog.table){ tableStep(); return; }
  const D=dog.D; dog.elev=0;

  if(dog.mode==='go'){ tx=dog.tx; ty=dog.ty; if(Math.hypot(tx-dog.x,ty-dog.y)<1.5&&!dragging) dog.mode='stand'; }
  const dx=tx-dog.x, dy=ty-dog.y, d=Math.hypot(dx,dy);
  const want=Math.min(D.max,d*.12), wx=d?dx/d*want:0, wy=d?dy/d*want:0;
  dog.vx+=(wx-dog.vx)*D.accel; dog.vy+=(wy-dog.vy)*D.accel;
  if(dog.mode==='down'){ dog.vx*=.7; dog.vy*=.7; }
  dog.x+=dog.vx; dog.y+=dog.vy;
  for(const ob of COURSE) pushCircleRect(dog,2.5,ob.box);
  dog.x=clamp(dog.x,3,LW-3); dog.y=clamp(dog.y,4,LH-2);
  dog.spd=Math.hypot(dog.vx,dog.vy);
  if(Math.abs(dog.vx)>.05) dog.face=dog.vx>0?1:-1;
  dog.anim+=dog.spd*.35;
  const ob=COURSE[curIdx];

    const a=ob.L/2+4, ex=ob.cx-ob.ux*a, ey=ob.cy-ob.uy*a;
    if(Math.hypot(dog.x-ex,dog.y-ey)<8 && (dog.vx*ob.ux+dog.vy*ob.uy)>.25) startPerform(ob);
  }
}
function stepAgi(){

/* ---------- Audio: Simlish shepherd ---------- */
let AC=null, master=null, muted=false, noiseBuf=null;
function audio(){
  if(muted) return null;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);}catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function noiseSrc(){
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=AC.createBufferSource(); s.buffer=noiseBuf; return s;
}
function env(g,t,a,peak,hold,rel){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.linearRampToValueAtTime(0,t+a+hold+rel); }
const VOW={a:[800,1250],e:[480,1900],i:[300,2350],o:[480,860],u:[330,760],ai:[[780,1250],[320,2300]]};
function consonant(c,t,f0,dest){
  if('ktpshf'.includes(c)){
    const n=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain();
    bp.type='bandpass'; bp.frequency.value={k:2400,t:4200,p:900,s:6000,h:1500,f:3200}[c]; bp.Q.value=c==='s'?2:1.2;
    const len=c==='s'?.08:(c==='h'||c==='f')?.06:.035; env(g,t,.004,(c==='h'||c==='f')?.15:.3,len*.5,len*.5);
    n.connect(bp).connect(g).connect(dest); n.start(t); n.stop(t+len+.02); return t+len+.01;
  }
  const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
  o.type='triangle'; o.frequency.value=f0; lp.type='lowpass'; lp.frequency.value=c==='l'||c==='w'?900:500;
  const len='bd'.includes(c)?.025:.045; env(g,t,.005,.5,len*.5,len*.5);
  o.connect(lp).connect(g).connect(dest); o.start(t); o.stop(t+len+.02); return t+len;
}
function speak(sylls,opt={}){
  if(!audio()) return;
  let t=AC.currentTime+.03;
  const base=(opt.pitch||330)*(.97+Math.random()*.06);
  const bus=AC.createGain(); bus.gain.value=opt.vol||1;
  const soft=AC.createBiquadFilter(); soft.type='lowpass'; soft.frequency.value=3200; soft.Q.value=.5;
  bus.connect(soft).connect(master);
  sylls.forEach((sy,i)=>{
    const last=i===sylls.length-1, f0=base*(sy.p||1);
    if(sy.c) for(const ch of sy.c) t=consonant(ch,t,f0,bus);
    const dur=(sy.d||.1)*(last?(opt.slow?1.7:1.4):1);
    const o=AC.createOscillator(), o2=AC.createOscillator(), o2g=AC.createGain();
    o.type='triangle'; o2.type='sine'; o2g.gain.value=.22;
    [o,o2].forEach((osc,j)=>{ const m=j?2:1;
      osc.frequency.setValueAtTime(f0*1.1*m,t);
      osc.frequency.exponentialRampToValueAtTime(f0*m,t+.04);
      osc.frequency.exponentialRampToValueAtTime(f0*m*(last?(opt.fall?.86:1.22):1.03),t+dur); });
    const g=AC.createGain(); env(g,t,.012,.55,Math.max(.01,dur-.05),.038);
    const out=AC.createGain(); out.gain.value=1.6;
    const dry=AC.createGain(); dry.gain.value=.35; g.connect(dry).connect(out);
    const v=VOW[sy.v], A=Array.isArray(v[0])?v[0]:v, B=Array.isArray(v[0])?v[1]:v;
    [0,1].forEach(k=>{ const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=k?4:2.5;
      bp.frequency.setValueAtTime(A[k]*1.12,t); bp.frequency.linearRampToValueAtTime(B[k]*1.12,t+dur);
      const fg=AC.createGain(); fg.gain.value=k?.5:1; g.connect(bp); bp.connect(fg); fg.connect(out); });
    o.connect(g); o2.connect(o2g).connect(g); out.connect(bus);
    o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
    t+=dur;
    if(sy.t) for(const ch of sy.t) t=consonant(ch,t,f0,bus);
    t+=(sy.gap||.03);
  });
}
function whistle(){
  if(!audio()) return; const t=AC.currentTime+.02;
  const o=AC.createOscillator(), g=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(2700,t+.16); o.frequency.exponentialRampToValueAtTime(1900,t+.34);
  env(g,t,.02,.22,.28,.06); o.connect(g).connect(master); o.start(t); o.stop(t+.45);
}
function bleat(s){
  if(!audio()) return; const t=AC.currentTime+.01;
  const o=AC.createOscillator(), lfo=AC.createOscillator(), lg=AC.createGain(), bp=AC.createBiquadFilter(), bp2=AC.createBiquadFilter(), g=AC.createGain();
  const f=(s.stubborn?300:390)+Math.random()*70;
  o.type='sawtooth'; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*.88,t+.4);
  lfo.frequency.value=11; lg.gain.value=f*.07; lfo.connect(lg).connect(o.frequency);
  bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=4; bp2.type='bandpass'; bp2.frequency.value=1750; bp2.Q.value=8;
  env(g,t,.03,.32,.25,.12);
  const mix=AC.createGain(); mix.gain.value=2;
  o.connect(g); g.connect(bp); g.connect(bp2); bp.connect(mix); bp2.connect(mix);
  let out=mix; if(AC.createStereoPanner){ const p=AC.createStereoPanner(); p.pan.value=(s.x/LW)*1.4-.7; mix.connect(p); out=p; }
  out.connect(master); o.start(t); lfo.start(t); o.stop(t+.45); lfo.stop(t+.45);
}
function bark(){
  if(!audio()) return; const f=dog?dog.D.bark:560;
  [0,.16].forEach(dt=>{ const t=AC.currentTime+.02+dt;
    const o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
    o.type='square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.47,t+.08);
    lp.type='lowpass'; lp.frequency.value=1600; env(g,t,.005,.18,.04,.04);
    o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+.12); });
}
function brrr(pitch){
  if(!audio()) return; const t=AC.currentTime+.01;
  const n=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain(), am=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=700*pitch; bp.Q.value=1.5;
  lfo.type='square'; lfo.frequency.value=18*pitch; lg.gain.value=.5; am.gain.value=.5; lfo.connect(lg).connect(am.gain);
  env(g,t,.03,.22,.3,.12);
  n.connect(bp).connect(am).connect(g).connect(master); n.start(t); lfo.start(t); n.stop(t+.5); lfo.stop(t+.5);
}
function chime(){
  if(!audio()) return; const t=AC.currentTime+.01;
  [[880,0],[1320,.08]].forEach(([f,dt])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
    env(g,t+dt,.005,.16,.04,.12); o.connect(g).connect(master); o.start(t+dt); o.stop(t+dt+.25); });
}
function beep(f){
  if(!audio()) return; const t=AC.currentTime+.01, o=AC.createOscillator(), g=AC.createGain();
  o.type='square'; o.frequency.value=f; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800;
  env(g,t,.005,.1,.08,.04); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+.2);
}
function knock(){
  if(!audio()) return; const t=AC.currentTime+.01;
  const n=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain(); bp.type='bandpass'; bp.frequency.value=1100; bp.Q.value=3;
  env(g,t,.002,.5,.02,.06); n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t+.12);
  const o=AC.createOscillator(), g2=AC.createGain(); o.type='triangle'; o.frequency.setValueAtTime(260,t+.09); o.frequency.exponentialRampToValueAtTime(150,t+.2);
  env(g2,t+.09,.002,.3,.02,.1); o.connect(g2).connect(master); o.start(t+.09); o.stop(t+.25);
}
function splash(){
  if(!audio()) return; const t=AC.currentTime+.01;

const PORTS=[];
function addPort(c,key,getSpr){ const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  const P={c,g,key,getSpr,x:c.width/2,face:Math.random()<.5?1:-1,state:'wag',t:20+Math.random()*60,anim:0,hopT:0}; PORTS.push(P); return P; }
function portActive(P){ return P.key==='moxy'?pupOn:P.key===chosen; }
function nextPortState(P){
  if(P.key==='moxy'&&!pupOn){ P.state='lie'; P.t=200; return; }
  const opts=portActive(P)?['run','run','hop','wag','wag','lie','roll']:['wag','lie','lie','run','roll'];
  P.state=opts[(Math.random()*opts.length)|0];
  P.t=P.state==='roll'?110:(P.state==='hop'?40:60)+Math.random()*(P.state==='lie'?200:110);
  if(P.state==='run'&&Math.random()<.5) P.face*=-1;
}
function animPorts(){
  for(const P of PORTS){
    const S=P.getSpr(), W=P.c.width, H=P.c.height, g=P.g;
    if(--P.t<=0) nextPortState(P);
    let fr=S.wag[0], up=0, rot=0;
    if(P.state==='run'){
      fr=S.run[(P.anim|0)%2]; const half=fr.w/2;
      P.x+=P.face*.4; P.anim+=.28;
      if(P.x>W-half){ P.x=W-half; P.face=-1; } if(P.x<half){ P.x=half; P.face=1; }
    } else if(P.state==='wag'){ fr=S.wag[(frames>>3)%2]; }
    else if(P.state==='lie'){ fr=S.down; }
    else if(P.state==='roll'){ const c=110-P.t; if(c<20){ fr=S.down; rot=Math.PI*c/20; } else if(c<90){ fr=S.run[(c>>3)&1]; rot=Math.PI; up=(c>>4)&1; } else { fr=S.down; rot=Math.PI*(1+(c-90)/20); } }
    else if(P.state==='hop'){ P.hopT++; up=Math.round(Math.abs(Math.sin(P.hopT*.2))*2); fr=S.wag[(frames>>2)%2]; }
    P.x=clamp(P.x,fr.w/2,W-fr.w/2);
    const x0=Math.round(P.x-fr.w/2);
    g.clearRect(0,0,W,H);
    g.fillStyle='rgba(58,42,31,.2)'; g.fillRect(x0+2,H-1,Math.max(1,fr.w-4),1);
    if(rot) drawPoseArt(g,fr,P.face,Math.round(P.x),H-1-up,rot); else g.drawImage(P.face>0?fr.r:fr.l,x0,H-1-fr.h-up);
    if(P.key==='moxy'&&!pupOn){ const z=(frames>>4)%3; g.fillStyle='#7a6a55'; g.fillRect(Math.min(W-1,x0+fr.w-1+z),3-z,1,1); }
  }
}

let VH=105, GY=83;
const scv=document.getElementById('side'), sctx=scv.getContext('2d');
let SS=3, SC=null, sdog=null, spup=null, camX=0, sfx=[], samb=[], LFar, LMid, LGround, SPAL;
let jumpHeld=false, jumpTap=false, slowHeld=false, lastSlowSay=0;
function fitSide(){
  const r=stage.getBoundingClientRect();
  const kw=Math.max(1,(r.width-12)/VW);
  const vh=Math.round(clamp((r.height-14)/kw,92,VW*0.62));

  if(vh!==VH){ VH=vh; GY=VH-22; if(SC) buildSideLayers(); }
  const dpr=window.devicePixelRatio||1;
  const s=Math.max(2,Math.min(8,Math.round(k*dpr)));
  if(s!==SS||scv.width!==VW*s||scv.height!==VH*s){ SS=s; scv.width=VW*SS; scv.height=VH*SS; }
  sctx.imageSmoothingEnabled=false;
  scv.style.width=Math.floor(VW*k)+'px'; scv.style.height=Math.floor(VH*k)+'px';
}

function hexRGB(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join(''); }
function mixHex(a,b,t){ const A=hexRGB(a),B=hexRGB(b); return rgbHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
const shade=(h,f)=>mixHex(h,'#000000',1-f);

function mkEnt(src,x){ const f=src.spr.run[0];
  return {x,y:0,vx:0,vy:0,gr:true,coy:0,jbuf:0,held:false,holdT:99,holdMax:12,anim:0,lie:0,pitch:0,sq:0,src,w:f.w,h:f.h,lead:f.w/2-1,
    face:1,bump:0,inTun:null,weave:null,table:'none',tcount:0,run:false,ready:0,fin:false,wantLie:false,landed:false,lastLand:0}; }

/* --- course --- */
const SIDE_PAL={spring:{sky:['#bfe3f2','#e4f4ef'],hill:'#a9d08c',hill2:'#8fbf74'},summer:{sky:['#94cdee','#d9f0f4'],hill:'#93c06c',hill2:'#7aac59'},
  autumn:{sky:['#efd2ad','#f7e8d2'],hill:'#c9a35a',hill2:'#a97a3e'},winter:{sky:['#c8d6e3','#eef3f6'],hill:'#e3ecf1',hill2:'#c9d8e0'}};
const CUES={jump:'hopp',tire:'hopp',tunnel:'tunnel',weave:'weave',aframe:'aframe',dogwalk:'dogwalk',seesaw:'seesaw',table:'table'};
function makeObs(type,x){
  const o={type,x0:x};
  switch(type){
    case 'jump': o.x1=x+5; o.bx=x+2; o.top=-8; break;
    case 'tire': o.x1=x+7; o.cx=x+3; o.cy=-8; o.top=-16; break;
    case 'tunnel': o.x1=x+26; o.top=-7; break;
    case 'weave': o.x1=x+38; o.top=-10; break;
    case 'aframe': o.x1=x+34; o.H=13; o.contact=7; o.top=-13; break;
    case 'dogwalk': o.x1=x+56; o.H=8; o.ramp=18; o.contact=6; o.top=-8; break;
    case 'seesaw': o.x1=x+30; o.px=x+15; o.pv=-3; o.contact=6; o.top=-6; break;
    case 'table': o.x1=x+13; o.top=-5; break;
  }
  return o;
}
function resetObs(o){ o.done=false; o.fault=false; o.called=false; o.knocked=false; o.kt=0; o.hit=0; o.cOK=0; o.completed=false;
  if(o.type==='seesaw'){ o.t=o.pv/(o.px-o.x0); o.tt=o.t; o.tv=0; } }
function genSide(){
  const specials=shuffle(['tunnel','weave','aframe','dogwalk','seesaw','table','tire']);
  let list=shuffle(specials.concat(Array(4+((rnd()*2)|0)).fill('jump')));
  list.splice(list.indexOf('jump'),1); list.unshift('jump');
  let x=62; const obs=[];
  list.forEach(t=>{ const o=makeObs(t,x); obs.push(o); x=o.x1+34+rnd()*26+(o.contact?10:0); });
  const clouds=[]; for(let i=0;i<7;i++) clouds.push({x:rnd()*460,y:5+rnd()*20,w:10+((rnd()*14)|0)});
  SC={obs,startX:32,finishX:x+6,clouds};
}
function obsY(o,x,ey){
  if(x<o.x0||x>o.x1) return 0;
  switch(o.type){
    case 'aframe': { const half=(o.x1-o.x0)/2; return -o.H*(1-Math.abs(x-o.x0-half)/half); }
    case 'dogwalk': { const a=x-o.x0, b=o.x1-x; if(a<o.ramp) return -o.H*a/o.ramp; if(b<o.ramp) return -o.H*b/o.ramp; return -o.H; }
    case 'seesaw': return Math.min(0,o.pv+(x-o.px)*o.t);
    case 'table': return ey<=o.top+2?o.top:0;
  }
  return 0;
}
function heightAt(x,ey){ let h=0; for(const o of SC.obs){ if(x<o.x0) break; if(x>o.x1) continue; h=Math.min(h,obsY(o,x,ey)); } return h; }
const slopeAt=(x,ey)=>(heightAt(x+0.5,ey)-heightAt(x-0.5,ey));
const onSeesaw=x=>SC.obs.some(o=>o.type==='seesaw'&&x>=o.x0&&x<=o.x1);

/* --- physics: smooth acceleration, coyote time, jump buffer, hold-to-jump-higher --- */
function jumpEnt(e,v){ e.vy=-v; e.gr=false; e.coy=0; e.holdT=0; e.sq=-0.15; spawnDust(e.x,e.y,2); }
function moveEnt(e,snap,sticky){
  let nx=e.x+e.vx;
  if(e.vx>0) for(const o of SC.obs){ if(o.type!=='table') continue;
    if(e.y>o.top+0.6&&e.x+e.lead<=o.x0+0.01&&nx+e.lead>o.x0){ nx=o.x0-e.lead; if(e.gr){ if(e===sdog&&e.vx>0.3) thud(); e.vx=-0.1; } e.bump=6; } }
  if(e.gr){
    const g=heightAt(nx,e.y), drop=g-e.y;
    if(drop>snap&&!(sticky&&onSeesaw(nx))){ e.gr=false; e.vy=Math.min(0.4,drop*0.4); e.coy=6; e.holdT=99; e.x=nx; }
    else { e.x=nx; e.y=g; }
  } else {
    let g=G;
    if(!e.held) e.holdT=99;
    if(e.vy<0&&e.held&&e.holdT<e.holdMax){ g*=0.45; e.holdT++; }
    else if(Math.abs(e.vy)<0.22) g*=0.6;
    else if(e.vy>0) g*=1.15;
    const oy=e.y; e.vy=Math.min(2.5,e.vy+g); e.x=nx; e.y+=e.vy;
    const h=heightAt(e.x,oy);
    if(e.vy>=0&&e.y>=h){ e.y=h; e.lastLand=e.vy; e.sq=Math.min(0.25,e.vy*0.12); e.vy=0; e.gr=true; e.landed=true; }
    if(e.coy>0) e.coy--;
  }
}
function animEnt(e){
  e.anim+=Math.abs(e.vx)*0.35;
  e.lie+=((e.wantLie?1:0)-e.lie)*0.2;
  const tp=e.lie>0.5?0:e.gr?Math.atan(slopeAt(e.x,e.y)):clamp(e.vy*0.22,-0.35,0.4);
  e.pitch+=(tp-e.pitch)*0.25;
  e.sq*=0.8;
}
function spawnDust(x,y,n){ for(let i=0;i<n;i++) sfx.push({x:x+(rnd()-.5)*4,y:y-0.5,vx:(rnd()-.6)*0.4,vy:-rnd()*0.3,g:0.02,life:14+rnd()*8,c:SEASON.ice?'#ffffff':pick(['#d8c9a6','#c9b88f'])}); }

/* --- run state --- */
function resetSide(){
  if(!SC) return;
  curIdx=0; faults=0; timing=false; runFrames=0;
  SC.obs.forEach(resetObs);
  sdog=mkEnt(DOGS[chosen],12); sdog.D=DOGS[chosen]; dog=sdog;
  spup=pupOn?mkEnt(MOXY,2):null;
  camX=sdog.x-VW*0.25; sfx=[];
  hudSide();
}
function sideFault(o,msg){ o.fault=true; faults++; bubble('Uuups!',msg+' · +5 s'); knock(); hudSide(); }
function doneObs(o){ o.done=true; curIdx++; if(!o.fault){ chime(); for(let i=0;i<6;i++) sfx.push({x:sdog.x+(rnd()-.5)*6,y:sdog.y-sdog.h-rnd()*4,vx:(rnd()-.5)*.6,vy:-rnd()*.6,g:.03,life:22,c:pick(['#f2c14e','#ffffff'])}); } hudSide(); }
function sideEvents(px){
  const d=sdog, x=d.x;
  if(!timing&&px<SC.startX&&x>=SC.startX){ timing=true; runFrames=0; }
  const o=SC.obs[curIdx];
  if(!o){ if(px<SC.finishX&&x>=SC.finishX) finishSide(); return; }
  if(!o.called&&d.run&&x>o.x0-50){ o.called=true; if(!faultBubbleActive()) say(CUES[o.type]); }
  const cross=X=>px<X&&x>=X;
  switch(o.type){
    case 'jump': if(cross(o.bx)){ if(d.y>-4.5){ o.knocked=true; sideFault(o,'Stange gefallen'); } doneObs(o); } break;
    case 'tire': if(cross(o.cx)){ const bc=d.y-d.h*0.55; if(Math.abs(bc-o.cy)>2.5){ o.hit=24; sideFault(o,bc<o.cy?'Über den Reifen':'Unter dem Reifen durch'); } doneObs(o); } break;
    case 'tunnel': if(cross(o.x0+1)){ if(d.gr||d.y>-2) d.inTun=o; else sideFault(o,'Tunnel ausgelassen'); } if(cross(o.x1)){ d.inTun=null; doneObs(o); } break;
    case 'weave': if(cross(o.x0)){ if(d.gr&&d.vx<=0.7) d.weave=o; else sideFault(o,'Slalom verpasst'); } if(cross(o.x1)){ d.weave=null; doneObs(o); } break;
    case 'aframe': case 'dogwalk': case 'seesaw':
      if(x>=o.x1-o.contact&&x<=o.x1&&d.gr&&d.vx<=0.62) o.cOK++;
      if(cross(o.x1)){ if(o.cOK<4) sideFault(o,'Kontaktzone verpasst'); doneObs(o); }
      break;
    case 'table':
      if(d.table==='none'&&d.gr&&x>=o.x0&&x<=o.x1&&Math.abs(d.y-o.top)<0.3){ d.table='await'; bubble('Lai-dunn?','Jetzt Lie down drücken'); }

}
function sidePlatz(){

}
function updSidePup(){
  const p=spup, d=sdog, tx=d.x-14;
  let tgt=clamp((tx-p.x)*0.06,-0.5,1.6); if(Math.abs(tx-p.x)<2) tgt=0;
  if(p.gr) p.vx+=(tgt-p.vx)*0.1;
  if(p.bump>0) p.bump--;
  if(p.gr&&p.bump>0&&tx>p.x+3){ p.held=true; p.holdMax=8; jumpEnt(p,1.3); }
  else if(p.gr&&Math.abs(p.vx)<0.04&&rnd()<0.004){ p.held=false; jumpEnt(p,0.7); if(rnd()<.4) yip(); }
  moveEnt(p,2,true);
  if(p.landed){ p.landed=false; if(p.lastLand>0.8) spawnDust(p.x,p.y,2); }

function stepSide(){
  frames++;
  const d=sdog; if(!d) return;
  const D=d.D.sd, px=d.x;
  let target=0;
  if(state==='play'){
    if(d.ready>0&&--d.ready===0) d.run=true;
    target=d.run?(slowHeld?D.slow:D.spd):0;
    if(d.weave) target=Math.min(target,.52);
  }
  if(d.table==='await'||d.table==='lie'||d.fin) target=0;
  if(jumpTap){ d.jbuf=8; jumpTap=false; }
  if(d.gr){ const sl=slopeAt(d.x,d.y); if(target>0) target*=sl<0?1+sl*0.3:1+sl*0.15; d.vx+=(target-d.vx)*(target<d.vx?D.brake:D.acc); }
  else d.vx+=(target-d.vx)*0.012;
  d.held=jumpHeld; d.holdMax=D.hold;
  if(d.jbuf>0){ d.jbuf--; if((d.gr||d.coy>0)&&state==='play'&&d.table!=='lie'){ if(target>0) d.vx=Math.max(d.vx,0.4); jumpEnt(d,D.jump); d.jbuf=0; whoosh(); } }
  moveEnt(d,0.55,d.vx<=0.65);
  if(d.landed){ d.landed=false; spawnDust(d.x,d.y,d.lastLand>1?4:2); if(d.lastLand>1.2) thud(); }
  if(d.gr&&Math.abs(d.vx)>0.9&&frames%8===0) spawnDust(d.x-d.w/2,d.y,1);
  const tb=SC.obs[curIdx];
  if(tb&&tb.type==='table'&&(d.table==='await'||d.table==='lie')&&d.x>tb.x1-3){ d.x=tb.x1-3; d.vx=Math.min(d.vx,0); }
  if(state==='play') sideEvents(px);
  if(d.table==='lie'){
    d.tcount++;
    if(d.tcount===1||d.tcount===41||d.tcount===81) beep(d.tcount===81?990:660);
    const o=SC.obs[curIdx];
    if(D.early&&d.tcount===70&&rnd()<D.early){ o.completed=true; d.table='go'; sideFault(o,'Zu früh vom Tisch'); }
    else if(d.tcount>=121){ o.completed=true; d.table='go'; say('go'); }
  }
  d.wantLie=d.table==='lie';
  for(const o of SC.obs){
    if(o.type==='seesaw'){
      const lim=-o.pv/(o.px-o.x0);
      if(d.x>o.px+2&&o.tt<0) o.tt=lim;
      o.tv+=(o.tt-o.t)*0.035; o.tv*=0.86; o.t+=o.tv;
      if(Math.abs(o.t)>lim){ o.t=Math.sign(o.t)*lim; if(Math.abs(o.tv)>0.004) thud(); o.tv*=-0.25; }
    }
    if(o.knocked) o.kt=Math.min(1,o.kt+0.07);
    if(o.hit>0) o.hit--;
  }
  animEnt(d);
  d.face=1;
  if(pupOn&&spup) updSidePup();
  if(state==='play'&&timing){ runFrames++; if(runFrames%6===0) hudSide(); }
  const ct=d.x-VW*0.25+clamp(d.vx,0,1.4)*22; camX+=(ct-camX)*0.09;
  sfx.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; }); sfx=sfx.filter(p=>p.life>0&&p.y<VH-GY);
  sideAmbient();
}
function sideAmbient(){
  const k=SEASON.ambient, top=-GY-2;
  if(k==='snow'&&rnd()<.45) samb.push({x:camX+rnd()*(VW+40),y:top,vx:-0.1,vy:.2+rnd()*.25,ph:rnd()*6,c:'#ffffff',k});
  if(k==='leaf'&&rnd()<.06) samb.push({x:camX+rnd()*(VW+60),y:top,vx:-0.25-rnd()*.25,vy:.25+rnd()*.2,ph:rnd()*6,c:pick(['#d9822e','#a8501f','#efb24c']),k});
  if(k==='petal'&&rnd()<.05) samb.push({x:camX+rnd()*(VW+60),y:top,vx:-0.2-rnd()*.2,vy:.2+rnd()*.15,ph:rnd()*6,c:pick(['#f6bfd0','#ffffff']),k});
  if(k==='butterfly'&&samb.length<4) samb.push({x:camX+VW+rnd()*60,y:-12-rnd()*26,vx:0,vy:0,ph:rnd()*6,c:pick(['#fff3a8','#ffffff','#f6bfd0']),k:'fly'});
  samb.forEach(p=>{ if(p.k==='fly'){ p.vx+=(rnd()-.5)*.06; p.vy+=(rnd()-.5)*.06; p.vx*=.96; p.vy*=.96; p.x+=p.vx; p.y=clamp(p.y+p.vy,-45,-5); }
    else { p.x+=p.vx+Math.sin(p.ph+frames*.05)*.2; p.y+=p.vy; } });

}
function hudSide(){

function finishSide(){

function drawLayer(L,f){ const tw=L.width; let off=-((camX*f)%tw); if(off>0) off-=tw; for(let x=off;x<VW;x+=tw) sctx.drawImage(L,Math.round(x*SS),0,tw*SS,VH*SS); }
function drawSkyBack(){

const visible=o=>o.x1>camX-12&&o.x0<camX+VW+12;
const Y='#f2c14e', WD='#c99566', WDD='#8a6340', DK='#5e3f28';
function weaveFront(o,i){ const d=sdog; if(d.weave!==o) return false; return ((i+Math.floor((d.x-o.x0)/3))&1)===0; }
function drawTire(o,back){
  const wob=o.hit>0?Math.round(Math.sin(o.hit*0.8)):0;
  for(let yy=-4;yy<=4;yy++){ const w=1.6*Math.sqrt(Math.max(0,1-(yy/4.5)**2)), c=(yy+4)%2?'#f2c14e':'#3a2a1f';
    if(Math.abs(yy)>=3){ if(back) WR(Math.round(o.cx-w)+wob,o.cy+yy,Math.round(w*2)+1,1,c); }
    else if(back) WR(Math.round(o.cx+w)+wob,o.cy+yy,1,1,c);
    else WR(Math.round(o.cx-w)+wob,o.cy+yy,1,1,c); }
}
function drawBoards(o,cz){ for(let x=o.x0;x<o.x1;x++){ const top=Math.round(obsY(o,x+0.5,0)), z=x<o.x0+o.contact||x>=o.x1-o.contact;
  WR(x,top-1,1,1,z?Y:WD); WR(x,top,1,1,z?'#c99a2e':WDD); } }
function drawObsBack(o){
  switch(o.type){
    case 'jump': { const x=o.bx;
      WR(x+1,-7,1,7,'#3a64a0'); WR(x+1,-7,2,1,'#3a64a0');
      if(o.knocked){ const fy=Math.round(-4+o.kt*3); for(let k=0;k<5;k++) WR(x-2+k,fy,1,1,k%2?'#ffffff':'#d94b4b'); }
      else [[-2,-4],[-1,-4],[0,-5],[1,-5]].forEach(([dx,dy],k)=>WR(x+dx,dy,1,1,k%2?'#ffffff':'#d94b4b'));
      break; }
    case 'tire': WR(o.cx+3,-15,1,15,DK); WR(o.cx-1,-15,5,1,DK); WR(o.cx,-14,1,2,'#d8ccb0'); WR(o.cx-2,-1,7,1,DK); drawTire(o,true); break;
    case 'weave': WR(o.x0,-1,o.x1-o.x0,1,'#d8ccb0'); for(let i=0;i<12;i++) if(!weaveFront(o,i)) drawPole(o.x0+2+i*3); break;
    case 'aframe': { const m=Math.round((o.x0+o.x1)/2); WR(m,-o.H,1,o.H,DK); WR(o.x0+8,-6,o.x1-o.x0-16,1,DK); drawBoards(o); break; }
    case 'dogwalk': [o.x0+o.ramp+2,o.x1-o.ramp-3].forEach(sx=>{ WR(sx,-o.H+1,1,o.H-1,DK); WR(sx-2,-1,5,1,DK); }); drawBoards(o); break;
    case 'seesaw':
      for(let k=0;k<=-o.pv;k++) WR(o.px-k*0.5,o.pv+k,k+1,1,DK);
      for(let x=o.x0;x<o.x1;x++){ const y=Math.round(Math.min(0,o.pv+(x+0.5-o.px)*o.t)), z=x<o.x0+o.contact||x>=o.x1-o.contact; WR(x,y-1,1,1,z?Y:WD); }

      WR(o.x0+1,o.top+2,1,-o.top-2,WDD); WR(o.x1-2,o.top+2,1,-o.top-2,WDD); WR(o.x0+3,o.top+2,1,-o.top-2,DK); WR(o.x1-4,o.top+2,1,-o.top-2,DK);
      WR(o.x0,o.top,o.x1-o.x0,1,'#f0d27f'); WR(o.x0,o.top+1,o.x1-o.x0,1,'#d9b15a');

  }
}
function drawPole(x){ for(let k=0;k<9;k++) WR(x,-9+k,1,1,k%2?'#ffffff':'#d94b4b'); WR(x,-10,1,1,'#3a2a1f'); }

/* --- sounds --- */
function thud(){ if(!audio()) return; const t=AC.currentTime+.01, o=AC.createOscillator(), g=AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(70,t+.12);
  env(g,t,.004,.22,.03,.1); o.connect(g).connect(master); o.start(t); o.stop(t+.2); }
function whoosh(){ if(!audio()) return; const t=AC.currentTime+.01, n=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain();
  bp.type='bandpass'; bp.frequency.setValueAtTime(600,t); bp.frequency.exponentialRampToValueAtTime(1800,t+.15); bp.Q.value=1.2;
  env(g,t,.02,.06,.05,.1); n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t+.25); }

function fitFarm(){

  const fh=Math.round(clamp((r.height-14)/kw,110,FW*1.3));
  const k=Math.max(1,Math.min(kw,(r.height-14)/fh));
  FH=fh;
  const dpr=window.devicePixelRatio||1, s=Math.max(2,Math.min(8,Math.round(k*dpr)));
